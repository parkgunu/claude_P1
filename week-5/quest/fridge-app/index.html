  <script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useContext, createContext, useRef } = React;

// ========================================
// ⚙️ 상수 · 유틸리티
// ========================================

/** 프로토타입 기준일. 실제 앱이라면 new Date() 를 쓴다. */
const TODAY = '2026-09-19';

const CATEGORIES = ['채소', '채소/절임', '단백질', '유제품', '가공육', '곡물', '건어물', '양념'];
const STORAGES = ['냉장', '냉동', '실온'];
const UNITS = ['개', 'g', 'ml', '장', '대', '모', '캔', '봉'];

function toDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

/** 오늘 기준 남은 일수. 음수면 기한이 지난 것. */
function daysLeft(expiresOn) {
  return Math.round((toDate(expiresOn) - toDate(TODAY)) / 86400000);
}

function formatDate(iso) {
  const [, m, d] = iso.split('-');
  return `${Number(m)}월 ${Number(d)}일`;
}

/**
 * 유통기한 상태 구분.
 * expired(지남) / today(오늘까지) / urgent(3일 내) / soon(7일 내) / fresh(여유)
 */
function expiryStatus(expiresOn) {
  const d = daysLeft(expiresOn);
  if (d < 0) return { key: 'expired', label: `${-d}일 지남`, short: '지남', tone: 'rose', days: d };
  if (d === 0) return { key: 'today', label: '오늘까지', short: 'D-0', tone: 'rose', days: d };
  if (d <= 3) return { key: 'urgent', label: `${d}일 남음`, short: `D-${d}`, tone: 'amber', days: d };
  if (d <= 7) return { key: 'soon', label: `${d}일 남음`, short: `D-${d}`, tone: 'yellow', days: d };
  return { key: 'fresh', label: `${d}일 남음`, short: `D-${d}`, tone: 'emerald', days: d };
}

/**
 * 톤별 Tailwind 클래스 매핑.
 * 템플릿 리터럴로 클래스명을 조립하지 않고 정적 문자열을 고르게 해 안전성을 확보한다.
 */
const TONE = {
  rose:    { chip: 'bg-rose-50 text-rose-700 ring-rose-200',       bar: 'bg-rose-500',    dot: 'bg-rose-500',    text: 'text-rose-600',    soft: 'bg-rose-50',    border: 'border-rose-200' },
  amber:   { chip: 'bg-amber-50 text-amber-700 ring-amber-200',    bar: 'bg-amber-500',   dot: 'bg-amber-500',   text: 'text-amber-600',   soft: 'bg-amber-50',   border: 'border-amber-200' },
  yellow:  { chip: 'bg-yellow-50 text-yellow-700 ring-yellow-200', bar: 'bg-yellow-400',  dot: 'bg-yellow-400',  text: 'text-yellow-600',  soft: 'bg-yellow-50',  border: 'border-yellow-200' },
  emerald: { chip: 'bg-emerald-50 text-emerald-700 ring-emerald-200', bar: 'bg-emerald-500', dot: 'bg-emerald-500', text: 'text-emerald-600', soft: 'bg-emerald-50', border: 'border-emerald-200' },
  slate:   { chip: 'bg-slate-100 text-slate-600 ring-slate-200',   bar: 'bg-slate-400',   dot: 'bg-slate-400',   text: 'text-slate-500',   soft: 'bg-slate-50',   border: 'border-slate-200' },
  sky:     { chip: 'bg-sky-50 text-sky-700 ring-sky-200',          bar: 'bg-sky-500',     dot: 'bg-sky-500',     text: 'text-sky-600',     soft: 'bg-sky-50',     border: 'border-sky-200' },
  violet:  { chip: 'bg-violet-50 text-violet-700 ring-violet-200', bar: 'bg-violet-500',  dot: 'bg-violet-500',  text: 'text-violet-600',  soft: 'bg-violet-50',  border: 'border-violet-200' },
};

/** 카테고리별 이모지 — 아이콘 라이브러리 없이 시각 구분을 준다. */
const CATEGORY_EMOJI = {
  '채소': '🥬', '채소/절임': '🥬', '단백질': '🍳', '유제품': '🥛',
  '가공육': '🥫', '곡물': '🍚', '건어물': '🍘', '양념': '🧂',
};

const STORAGE_TONE = { '냉장': 'sky', '냉동': 'violet', '실온': 'slate' };

const DIFFICULTY_TONE = { '아주 쉬움': 'emerald', '쉬움': 'emerald', '보통': 'amber' };

function cx(...parts) {
  return parts.filter(Boolean).join(' ');
}

// ========================================
// 🌐 API 클라이언트
// ========================================

// ⚠️ localhost 하드코딩 금지 — 상대 경로라야 로컬과 Vercel 양쪽에서 그대로 동작한다.
const API_BASE_URL = '/api';

/** 서버 응답 규약 { success, data, message } 를 풀어서 data 만 돌려준다. */
async function api(path, options = {}) {
  const res = await fetch(`${API_BASE_URL}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });

  let body = {};
  try { body = await res.json(); } catch (_) { /* 본문이 JSON 이 아닌 경우 */ }

  if (!res.ok || !body.success) {
    throw new Error(body.message || `요청이 실패했습니다 (HTTP ${res.status})`);
  }
  return body.data;
}

// ========================================
// 🧮 도메인 계산
// ========================================

/** 레시피와 보유 재료를 대조해 매칭 정보를 만든다. */
function matchRecipe(recipe, ingredients) {
  const owned = new Map(ingredients.map((i) => [i.id, i]));

  const lines = recipe.ingredients.map((ref) => {
    const item = owned.get(ref.id);
    return {
      ...ref,
      name: item ? item.name : (ref.name || ref.id),
      have: Boolean(item),
      item: item || null,
    };
  });

  const required = lines.filter((l) => !l.optional);
  const requiredHave = required.filter((l) => l.have);
  const missingRequired = required.filter((l) => !l.have);
  const missingOptional = lines.filter((l) => l.optional && !l.have);

  const rate = required.length === 0 ? 100 : Math.round((requiredHave.length / required.length) * 100);

  // 이 레시피가 소진해주는 임박 재료(3일 이내)
  const usesUrgent = lines
    .filter((l) => l.have && ['expired', 'today', 'urgent'].includes(expiryStatus(l.item.expiresOn).key))
    .map((l) => l.item);

  return {
    lines, rate,
    canCook: missingRequired.length === 0,
    missingRequired, missingOptional,
    usesUrgent,
  };
}

// 🎨 디자인 시스템 컴포넌트
// ========================================

function Button({ variant = 'primary', size = 'md', disabled, onClick, className = '', type = 'button', children, ...rest }) {

    secondary: 'bg-white text-slate-700 ring-1 ring-slate-200 hover:bg-slate-50',
    danger: 'bg-rose-50 text-rose-700 ring-1 ring-rose-200 hover:bg-rose-100',

  return (
    <button type={type} disabled={disabled} onClick={onClick}
      className={cx(base, variants[variant], sizes[size], className)} {...rest}>

    </button>

}

function Badge({ tone = 'slate', className = '', children }) {

function ProgressBar({ value, tone = 'emerald', className = '' }) {

        style={{ width: `${value}%` }} />

}

function Modal({ isOpen, onClose, title, size = 'md', children }) {
  useEffect(() => {
    if (!isOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [isOpen, onClose]);

  if (!isOpen) return null;
  const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onClick={onClose} aria-hidden="true" />

          <h2 className="text-base font-bold">{title}</h2>

            className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600">

  );
}

// ========================================
// 🔀 라우터 (해시 기반)
// ========================================

const RouterContext = createContext(null);
const ParamsContext = createContext({});

function useRouter() { return useContext(RouterContext); }
function useParams() { return useContext(ParamsContext); }

/** '/recipes/:id' 패턴과 실제 경로를 대조해 params 를 돌려준다. 불일치면 null. */
function matchRoute(pattern, path) {
  const p = pattern.split('/').filter(Boolean);
  const a = path.split('/').filter(Boolean);
  if (p.length !== a.length) return null;

  const params = {};
  for (let i = 0; i < p.length; i++) {
    if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(a[i]);
    else if (p[i] !== a[i]) return null;
  }
  return params;
}

function Router({ children }) {
  const [path, setPath] = useState(() => window.location.hash.slice(1) || '/');

  useEffect(() => {
    const onHash = () => {
      setPath(window.location.hash.slice(1) || '/');
      window.scrollTo(0, 0);
    };
    window.addEventListener('hashchange', onHash);
    if (!window.location.hash) window.location.hash = '#/';
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = useCallback((to) => { window.location.hash = '#' + to; }, []);

  return <RouterContext.Provider value={{ path, navigate }}>{children}</RouterContext.Provider>;
}

function Route() { return null; }

function Routes({ children }) {
  const { path } = useRouter();
  const routes = React.Children.toArray(children);

  for (const r of routes) {
    if (r.props.path === '*') continue;
    const params = matchRoute(r.props.path, path);
    if (params) {
      return <ParamsContext.Provider value={params}>{r.props.element}</ParamsContext.Provider>;
    }
  }
  const fallback = routes.find((r) => r.props.path === '*');
  return fallback ? fallback.props.element : null;
}

function Link({ to, className = '', children, ...rest }) {
  const { navigate } = useRouter();
  return (
    <a href={'#' + to} className={className}
      onClick={(e) => { e.preventDefault(); navigate(to); }} {...rest}>
      {children}
    </a>
  );
}

// 🗄️ 전역 상태 (냉장고)

const FridgeContext = createContext(null);
function useFridge() { return useContext(FridgeContext); }

function FridgeProvider({ children }) {
  const [ingredients, setIngredients] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  /** 재료와 레시피를 한 번에 다시 읽는다. */
  const reload = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const [nextIngredients, nextRecipes] = await Promise.all([
        api('/ingredients'),
        api('/recipes'),
      ]);
      setIngredients(nextIngredients);
      setRecipes(nextRecipes);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { reload(); }, [reload]);

  // 서버가 저장한 결과를 그대로 반영한다(id 생성·정규화가 서버 몫이므로).
  const addIngredient = useCallback(async (draft) => {
    const created = await api('/ingredients', { method: 'POST', body: JSON.stringify(draft) });
    setIngredients((prev) => [created, ...prev]);
    return created;
  }, []);

  const removeIngredient = useCallback(async (id) => {
    await api(`/ingredients/${encodeURIComponent(id)}`, { method: 'DELETE' });
    setIngredients((prev) => prev.filter((i) => i.id !== id));
  }, []);

  const value = useMemo(
    () => ({ ingredients, recipes, loading, error, reload, addIngredient, removeIngredient }),
    [ingredients, recipes, loading, error, reload, addIngredient, removeIngredient]
  );

  return <FridgeContext.Provider value={value}>{children}</FridgeContext.Provider>;
}

/** 로딩·에러를 한 곳에서 처리하고, 정상일 때만 children 을 그린다. */
function DataGate({ children }) {
  const { loading, error, reload } = useFridge();

  if (loading) {
    return (
      <Page>
        <div className="flex flex-col items-center justify-center py-24 text-center">
          <div className="h-8 w-8 animate-spin rounded-full border-4 border-slate-200 border-t-emerald-600" />
          <p className="mt-4 text-sm text-slate-500">냉장고를 여는 중...</p>
        </div>
      </Page>
    );
  }

  if (error) {
    return (
      <Page>
        <EmptyState
          emoji="🔌" title="서버에 연결하지 못했어요" description={error}
          action={<Button size="sm" onClick={reload}>다시 시도</Button>}
        />
      </Page>
    );
  }

  return children;
}

function DashboardPage() {
  const { ingredients, recipes } = useFridge();

  const stats = useMemo(() => {
    const expired = ingredients.filter((i) => expiryStatus(i.expiresOn).key === 'expired');
    const urgent = ingredients.filter((i) => ['today', 'urgent'].includes(expiryStatus(i.expiresOn).key));
    const cookable = recipes.filter((r) => matchRecipe(r, ingredients).canCook);
    return { expired, urgent, cookable };
  }, [ingredients, recipes]);

  /** 기한이 임박한 순으로 정렬한 상위 재료 */
  const useFirst = useMemo(
    () => [...ingredients].sort((a, b) => daysLeft(a.expiresOn) - daysLeft(b.expiresOn)).slice(0, 5),
    [ingredients]
  );

  /** 임박 재료를 많이 쓰는 순서로 추천 */
  const recommended = useMemo(() => {
    return recipes
      .map((r) => ({ recipe: r, match: matchRecipe(r, ingredients) }))
      .filter((x) => x.match.canCook)
      .sort((a, b) => b.match.usesUrgent.length - a.match.usesUrgent.length || a.recipe.minutes - b.recipe.minutes)
      .slice(0, 3);
  }, [ingredients, recipes]);

  return (
    <Page>
      <div className="mb-6">
        <p className="text-xs font-medium text-emerald-600">2026년 9월 19일 토요일</p>
        <h1 className="mt-1 text-2xl font-black tracking-tight sm:text-3xl">오늘 뭐 해먹지?</h1>
        <p className="mt-1.5 text-sm text-slate-500">
          냉장고에 <strong className="text-slate-700">{ingredients.length}개</strong> 재료가 있고,
          그중 <strong className="text-amber-600">{stats.urgent.length}개</strong>는 3일 안에 써야 합니다.
        </p>
      </div>

      <div className="mb-8 grid grid-cols-2 gap-3 lg:grid-cols-4">
        <StatTile label="보유 재료" value={ingredients.length} unit="개" tone="sky" hint="전체 품목 수" />
        <StatTile label="기한 지남" value={stats.expired.length} unit="개" tone="rose" hint="확인이 필요해요" />
        <StatTile label="3일 내 임박" value={stats.urgent.length} unit="개" tone="amber" hint="먼저 쓰세요" />
        <StatTile label="지금 만들 수 있는 요리" value={stats.cookable.length} unit="개" tone="emerald" hint={`전체 ${recipes.length}개 중`} />
      </div>

      <section className="mb-8">
        <SectionTitle
          title="먼저 써야 할 재료"
          description="유통기한이 가까운 순서입니다"
          right={<Link to="/fridge" className="text-xs font-medium text-emerald-600 hover:text-emerald-700">전체 보기 →</Link>}
        />
        <Card className="divide-y divide-slate-100 overflow-hidden">
          {useFirst.map((item) => {
            const status = expiryStatus(item.expiresOn);
            return (
              <Link key={item.id} to={`/fridge/${item.id}`}
                className="flex items-center gap-3 px-4 py-3 transition-colors hover:bg-slate-50">
                <span className={cx('h-2 w-2 shrink-0 rounded-full', TONE[status.tone].dot)} />
                <span className="text-lg">{CATEGORY_EMOJI[item.category] || '🍽️'}</span>
                <div className="min-w-0 flex-1">
                  <p className="truncate text-sm font-semibold text-slate-800">{item.name}</p>
                  <p className="text-[11px] text-slate-400">{item.quantity}{item.unit} · {item.storage}</p>
                </div>
                <div className="text-right">
                  <p className={cx('text-xs font-bold', TONE[status.tone].text)}>{status.label}</p>
                  <p className="text-[11px] text-slate-400">{formatDate(item.expiresOn)}</p>

              </Link>

          })}

      </section>

      <section>
        <SectionTitle
          title="지금 바로 만들 수 있어요"
          description="임박한 재료를 많이 쓰는 순서로 골랐습니다"
          right={<Link to="/recipes" className="text-xs font-medium text-emerald-600 hover:text-emerald-700">전체 보기 →</Link>}
        />
        {recommended.length === 0 ? (

const EMPTY_DRAFT = {
  name: '', category: '채소', quantity: '1', unit: '개',
  storage: '냉장', expiresOn: '', note: '',
};

function AddIngredientModal({ isOpen, onClose }) {
  const { addIngredient } = useFridge();
  const [draft, setDraft] = useState(EMPTY_DRAFT);
  const [errors, setErrors] = useState({});
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (isOpen) { setDraft(EMPTY_DRAFT); setErrors({}); setSaving(false); }
  }, [isOpen]);

  const set = (key) => (e) => setDraft((d) => ({ ...d, [key]: e.target.value }));

  const submit = async () => {
    const next = {};
    if (!draft.name.trim()) next.name = '재료 이름을 입력하세요.';
    if (!draft.expiresOn) next.expiresOn = '유통기한을 선택하세요.';
    if (!draft.quantity || Number(draft.quantity) <= 0) next.quantity = '1 이상이어야 합니다.';
    setErrors(next);
    if (Object.keys(next).length > 0) return;

    setSaving(true);
    try {
      await addIngredient({
        name: draft.name.trim(),
        category: draft.category,
        quantity: Number(draft.quantity),
        unit: draft.unit,
        storage: draft.storage,
        purchasedOn: TODAY,
        expiresOn: draft.expiresOn,
        tags: [],
        note: draft.note.trim(),
      });
      onClose();
    } catch (err) {
      setErrors({ form: err.message });
    } finally {
      setSaving(false);
    }
  };

  return (
    <Modal isOpen={isOpen} onClose={onClose} title="재료 추가">
      <div className="space-y-4">
        <Input label="재료 이름" value={draft.name} onChange={set('name')}
          placeholder="예: 애호박" error={errors.name} />

        <div className="grid grid-cols-2 gap-3">
          <Select label="분류" value={draft.category} onChange={set('category')} options={CATEGORIES} />
          <Select label="보관 방법" value={draft.storage} onChange={set('storage')} options={STORAGES} />
        </div>

        <div className="grid grid-cols-2 gap-3">
          <Input label="수량" type="number" min="1" value={draft.quantity}
            onChange={set('quantity')} error={errors.quantity} />
          <Select label="단위" value={draft.unit} onChange={set('unit')} options={UNITS} />
        </div>

        <Input label="유통기한" type="date" value={draft.expiresOn}
          onChange={set('expiresOn')} error={errors.expiresOn} />

        <Input label="메모 (선택)" value={draft.note} onChange={set('note')}
          placeholder="예: 개봉함. 빨리 써야 함" />

        {errors.form && (
          <p className="rounded-xl bg-rose-50 px-3 py-2 text-xs text-rose-700">{errors.form}</p>
        )}

        <div className="flex gap-2 pt-2">
          <Button variant="secondary" className="flex-1" onClick={onClose} disabled={saving}>취소</Button>
          <Button className="flex-1" onClick={submit} disabled={saving}>
            {saving ? '저장 중...' : '추가하기'}
          </Button>
        </div>
      </div>
    </Modal>
  );
}

const FRIDGE_FILTERS = [
  { key: 'all', label: '전체' },
  { key: 'expired', label: '기한 지남' },
  { key: 'urgent', label: '3일 내 임박' },
  { key: 'week', label: '일주일 내' },
];

function FridgePage() {
  const { ingredients } = useFridge();
  const [query, setQuery] = useState('');
  const [category, setCategory] = useState('전체');
  const [storage, setStorage] = useState('전체');
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState('expiry');
  const [modalOpen, setModalOpen] = useState(false);

  const visible = useMemo(() => {
    let list = ingredients.filter((i) => {
      if (query && !i.name.toLowerCase().includes(query.toLowerCase())) return false;
      if (category !== '전체' && i.category !== category) return false;
      if (storage !== '전체' && i.storage !== storage) return false;

      const d = daysLeft(i.expiresOn);
      if (filter === 'expired' && d >= 0) return false;
      if (filter === 'urgent' && (d < 0 || d > 3)) return false;
      if (filter === 'week' && (d < 0 || d > 7)) return false;
      return true;
    });

    const sorters = {
      expiry: (a, b) => daysLeft(a.expiresOn) - daysLeft(b.expiresOn),
      name: (a, b) => a.name.localeCompare(b.name, 'ko'),
      category: (a, b) => a.category.localeCompare(b.category, 'ko') || a.name.localeCompare(b.name, 'ko'),
      recent: (a, b) => toDate(b.purchasedOn) - toDate(a.purchasedOn),
    };
    return [...list].sort(sorters[sort]);
  }, [ingredients, query, category, storage, filter, sort]);

  const counts = useMemo(() => ({
    all: ingredients.length,
    expired: ingredients.filter((i) => daysLeft(i.expiresOn) < 0).length,
    urgent: ingredients.filter((i) => { const d = daysLeft(i.expiresOn); return d >= 0 && d <= 3; }).length,
    week: ingredients.filter((i) => { const d = daysLeft(i.expiresOn); return d >= 0 && d <= 7; }).length,
  }), [ingredients]);

  return (
    <Page>
      <div className="mb-5 flex items-end justify-between gap-3">
        <div>
          <h1 className="text-2xl font-black tracking-tight">내 냉장고</h1>
          <p className="mt-1 text-sm text-slate-500">{ingredients.length}개 재료를 보관 중입니다</p>
        </div>
        <Button onClick={() => setModalOpen(true)}>
          <span className="text-base leading-none">＋</span> 재료 추가
        </Button>
      </div>

      <Card className="mb-4 p-3">
        <div className="grid gap-2.5 sm:grid-cols-2 lg:grid-cols-4">
          <Input placeholder="재료 이름 검색" value={query}
            onChange={(e) => setQuery(e.target.value)} aria-label="재료 검색" />
          <Select value={category} onChange={(e) => setCategory(e.target.value)}
            options={['전체', ...CATEGORIES]} aria-label="분류 필터" />
          <Select value={storage} onChange={(e) => setStorage(e.target.value)}
            options={['전체', ...STORAGES]} aria-label="보관 방법 필터" />
          <Select value={sort} onChange={(e) => setSort(e.target.value)} aria-label="정렬"
            options={[
              { value: 'expiry', label: '유통기한 빠른 순' },
              { value: 'name', label: '이름순' },
              { value: 'category', label: '분류순' },
              { value: 'recent', label: '최근 구입순' },
            ]} />
        </div>

        <div className="no-scrollbar mt-3 flex gap-1.5 overflow-x-auto">
          {FRIDGE_FILTERS.map((f) => (
            <button key={f.key} onClick={() => setFilter(f.key)}
              aria-pressed={filter === f.key}
              className={cx(
                'shrink-0 rounded-full px-3 py-1.5 text-xs font-medium transition-colors',
                filter === f.key ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
              )}>
              {f.label} <span className="opacity-60">{counts[f.key]}</span>
            </button>
          ))}
        </div>
      </Card>

      {visible.length === 0 ? (
        <EmptyState
          emoji="🔍" title="조건에 맞는 재료가 없어요"
          description="검색어나 필터를 바꿔보세요."
          action={<Button variant="secondary" size="sm" onClick={() => {
            setQuery(''); setCategory('전체'); setStorage('전체'); setFilter('all');
          }}>필터 초기화</Button>}
        />
      ) : (
        <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
          {visible.map((item) => <IngredientCard key={item.id} item={item} />)}
        </div>
      )}

      <AddIngredientModal isOpen={modalOpen} onClose={() => setModalOpen(false)} />
    </Page>
  );
}

function IngredientDetailPage() {

              } catch (err) {
                setDeleteError(err.message);
                setDeleting(false);
              }
            }}>{deleting ? '삭제 중...' : '삭제'}</Button>
        </div>
      </Modal>
    </Page>
  );
}

// ========================================
// 📄 페이지 — 레시피 목록
// ========================================

const RECIPE_FILTERS = [
  { key: 'all', label: '전체' },
  { key: 'cookable', label: '지금 가능' },
  { key: 'missing', label: '재료 부족' },
  { key: 'urgent', label: '임박 재료 소진' },
];

function RecipesPage() {
  const { ingredients, recipes } = useFridge();
  const [query, setQuery] = useState('');
  const [filter, setFilter] = useState('all');
  const [sort, setSort] = useState('rate');

  const matched = useMemo(
    () => recipes.map((r) => ({ recipe: r, match: matchRecipe(r, ingredients) })),
    [ingredients, recipes]
  );

  const counts = useMemo(() => ({
    all: matched.length,
    cookable: matched.filter((x) => x.match.canCook).length,
    missing: matched.filter((x) => !x.match.canCook).length,
    urgent: matched.filter((x) => x.match.usesUrgent.length > 0).length,
  }), [matched]);

  const visible = useMemo(() => {
    let list = matched.filter(({ recipe, match }) => {
      if (query) {
        const q = query.toLowerCase();
        const hit = recipe.name.toLowerCase().includes(q)
          || recipe.tags.some((t) => t.toLowerCase().includes(q))
          || match.lines.some((l) => l.name.toLowerCase().includes(q));
        if (!hit) return false;
      }
      if (filter === 'cookable' && !match.canCook) return false;
      if (filter === 'missing' && match.canCook) return false;
      if (filter === 'urgent' && match.usesUrgent.length === 0) return false;
      return true;
    });

    const sorters = {
      rate: (a, b) => b.match.rate - a.match.rate || a.recipe.minutes - b.recipe.minutes,
      time: (a, b) => a.recipe.minutes - b.recipe.minutes,
      urgent: (a, b) => b.match.usesUrgent.length - a.match.usesUrgent.length || b.match.rate - a.match.rate,
      name: (a, b) => a.recipe.name.localeCompare(b.recipe.name, 'ko'),
    };
    return [...list].sort(sorters[sort]);
  }, [matched, query, filter, sort]);

  return (
    <Page>
      <div className="mb-5">
        <h1 className="text-2xl font-black tracking-tight">레시피</h1>
        <p className="mt-1 text-sm text-slate-500">
          지금 재료로 <strong className="text-emerald-600">{counts.cookable}개</strong>를 바로 만들 수 있어요
        </p>
      </div>

      <Card className="mb-4 p-3">
        <div className="grid gap-2.5 sm:grid-cols-2">
          <Input placeholder="요리 이름 · 재료 · 태그 검색" value={query}
            onChange={(e) => setQuery(e.target.value)} aria-label="레시피 검색" />
          <Select value={sort} onChange={(e) => setSort(e.target.value)} aria-label="정렬"
            options={[
              { value: 'rate', label: '재료 보유율 높은 순' },
              { value: 'time', label: '조리 시간 짧은 순' },
              { value: 'urgent', label: '임박 재료 많이 쓰는 순' },
              { value: 'name', label: '이름순' },
            ]} />
        </div>

        <div className="no-scrollbar mt-3 flex gap-1.5 overflow-x-auto">
          {RECIPE_FILTERS.map((f) => (
            <button key={f.key} onClick={() => setFilter(f.key)}
              aria-pressed={filter === f.key}
              className={cx(
                'shrink-0 rounded-full px-3 py-1.5 text-xs font-medium transition-colors',
                filter === f.key ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
              )}>
              {f.label} <span className="opacity-60">{counts[f.key]}</span>
            </button>
          ))}
        </div>
      </Card>

      {visible.length === 0 ? (
        <EmptyState
          emoji="🍳" title="조건에 맞는 레시피가 없어요"
          description="검색어나 필터를 바꿔보세요."
          action={<Button variant="secondary" size="sm"
            onClick={() => { setQuery(''); setFilter('all'); }}>필터 초기화</Button>}
        />
      ) : (
        <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
          {visible.map(({ recipe, match }) => (
            <RecipeCard key={recipe.id} recipe={recipe} match={match} />
          ))}
        </div>
      )}
    </Page>
  );
}

// ========================================
// 📄 페이지 — 레시피 상세
// ========================================

function RecipeDetailPage() {
  const { id } = useParams();
  const { ingredients, recipes } = useFridge();
  const [checked, setChecked] = useState({});

  const recipe = recipes.find((r) => r.id === id);
  const match = useMemo(
    () => (recipe ? matchRecipe(recipe, ingredients) : null),
    [recipe, ingredients]
  );

  if (!recipe) {
    return (
      <Page>
        <BackLink to="/recipes">레시피로 돌아가기</BackLink>
        <EmptyState emoji="❓" title="레시피를 찾을 수 없어요" description="잘못된 주소입니다." />
      </Page>
    );
  }

  const toggle = (key) => setChecked((c) => ({ ...c, [key]: !c[key] }));
  const tone = match.canCook ? 'emerald' : match.rate >= 70 ? 'amber' : 'rose';

  return (
    <Page>
      <BackLink to="/recipes">레시피</BackLink>

      <Card className="mb-4 overflow-hidden">
        <div className="flex items-start gap-4 px-5 py-5">
          <span className="grid h-16 w-16 shrink-0 place-items-center rounded-2xl bg-slate-50 text-4xl">
            {recipe.emoji}
          </span>
          <div className="min-w-0 flex-1">
            <div className="flex flex-wrap items-center gap-2">
              <h1 className="text-xl font-black tracking-tight">{recipe.name}</h1>
              {match.canCook
                ? <Badge tone="emerald">지금 만들 수 있어요</Badge>
                : <Badge tone="rose">재료 {match.missingRequired.length}개 부족</Badge>}
            </div>
            <p className="mt-2 text-sm leading-relaxed text-slate-600">{recipe.summary}</p>
            <div className="mt-3 flex flex-wrap gap-1.5">
              {recipe.tags.map((t) => <Badge key={t} tone="slate">#{t}</Badge>)}
            </div>
          </div>
        </div>

        <div className="grid grid-cols-3 divide-x divide-slate-100 border-t border-slate-100 text-center">
          {[
            ['조리 시간', `${recipe.minutes}분`],
            ['난이도', recipe.difficulty],
            ['분량', `${recipe.servings}인분`],
          ].map(([k, v]) => (
            <div key={k} className="px-3 py-3">
              <p className="text-[11px] text-slate-400">{k}</p>
              <p className="mt-0.5 text-sm font-bold text-slate-800">{v}</p>
            </div>
          ))}
        </div>

        <div className="border-t border-slate-100 px-5 py-4">
          <div className="mb-1.5 flex items-center justify-between text-xs">
            <span className="text-slate-500">필수 재료 보유율</span>
            <span className={cx('font-bold', TONE[tone].text)}>{match.rate}%</span>
          </div>
          <ProgressBar value={match.rate} tone={tone} />
        </div>
      </Card>

      {match.usesUrgent.length > 0 && (
        <div className="mb-4 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
          🔥 이 요리를 하면 임박한 재료 <strong>{match.usesUrgent.map((u) => u.name).join(', ')}</strong>를 소진할 수 있어요.
        </div>
      )}

      <section className="mb-6">
        <SectionTitle title="재료" description="냉장고에 있는 재료는 초록색으로 표시됩니다" />
        <Card className="divide-y divide-slate-100 overflow-hidden">
          {match.lines.map((line) => (
            <button key={line.id} onClick={() => toggle(line.id)}
              aria-pressed={Boolean(checked[line.id])}
              className="flex w-full items-center gap-3 px-4 py-3 text-left transition-colors hover:bg-slate-50">
              <span className={cx(
                'grid h-5 w-5 shrink-0 place-items-center rounded-md border-2 transition-colors',
                checked[line.id] ? 'border-emerald-500 bg-emerald-500' : 'border-slate-300 bg-white'
              )}>
                {checked[line.id] && (
                  <svg className="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                  </svg>
                )}
              </span>

              <div className="min-w-0 flex-1">
                <p className={cx(
                  'truncate text-sm font-semibold',
                  checked[line.id] ? 'text-slate-400 line-through' : 'text-slate-800'
                )}>
                  {line.name}
                  {line.optional && <span className="ml-1.5 text-[11px] font-normal text-slate-400">선택</span>}
                </p>
                {line.have && (
                  <p className="text-[11px] text-slate-400">
                    보유 {line.item.quantity}{line.item.unit} · {expiryStatus(line.item.expiresOn).label}
                  </p>
                )}
              </div>

              <span className="shrink-0 text-xs font-medium text-slate-500">{line.amount}</span>
              {line.have
                ? <Badge tone="emerald">보유</Badge>
                : <Badge tone={line.optional ? 'slate' : 'rose'}>없음</Badge>}
            </button>
          ))}
        </Card>

        {match.missingRequired.length > 0 && (
          <div className="mt-3 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
            🛒 장보기 목록: <strong>{match.missingRequired.map((m) => m.name).join(', ')}</strong>
          </div>
        )}
      </section>

      <section>
        <SectionTitle title="조리 순서" description={`총 ${recipe.steps.length}단계`} />
        <ol className="space-y-2.5">
          {recipe.steps.map((step, idx) => (
            <li key={idx}>
              <Card className="flex gap-3 p-4">
                <span className="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-emerald-600 text-xs font-bold text-white">
                  {idx + 1}
                </span>
                <p className="pt-0.5 text-sm leading-relaxed text-slate-700">{step}</p>
              </Card>
            </li>
          ))}
        </ol>
      </section>
    </Page>
  );
}

// ========================================
// 📄 페이지 — 404
// ========================================

function NotFoundPage() {
  return (
    <Page>
      <EmptyState
        emoji="🧭" title="페이지를 찾을 수 없어요"
        description="주소를 확인해 주세요."
        action={<Link to="/"><Button size="sm">홈으로</Button></Link>}
      />
    </Page>
  );
}

// ========================================
// 🚀 App
// ========================================

function App() {
  return (
    <Router>
      <FridgeProvider>
        <PrototypeNotice />
        <Header />
        <DataGate>
          <Routes>
            <Route path="/" element={<DashboardPage />} />
            <Route path="/fridge" element={<FridgePage />} />
            <Route path="/fridge/:id" element={<IngredientDetailPage />} />
            <Route path="/recipes" element={<RecipesPage />} />
            <Route path="/recipes/:id" element={<RecipeDetailPage />} />
            <Route path="*" element={<NotFoundPage />} />
          </Routes>
        </DataGate>
        <footer className="border-t border-slate-200 bg-white py-6 text-center text-[11px] text-slate-400">
          냉장고 파먹기 · Express + Supabase Postgres
        </footer>
      </FridgeProvider>
    </Router>
  );
}

// ========================================
// Rendering
// ========================================

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
