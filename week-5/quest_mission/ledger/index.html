<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가계부</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 은 버전을 명시적으로 고정한다. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원). -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현하기 어려운 것만 여기에 둔다 */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fade-in-up .18s ease-out both; }

    /* 숫자 입력의 스피너 제거 */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // ⚙️ Config & Utils
    // ========================================

    const API_BASE_URL = '/api';

    const KRW = new Intl.NumberFormat('ko-KR');
    const won = (n) => KRW.format(Number(n) || 0) + '원';

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const thisMonthStr = () => todayStr().slice(0, 7);

    const monthLabel = (m) => {
      if (!m) return '전체 기간';
      const [y, mm] = m.split('-');
      return `${y}년 ${Number(mm)}월`;
    };

    const dayLabel = (d) => {
      const [, mm, dd] = d.split('-');
      const weekday = ['일', '월', '화', '수', '목', '금', '토'][new Date(d + 'T00:00:00').getDay()];
      return `${Number(mm)}.${Number(dd)} (${weekday})`;
    };

    // 카테고리별 막대 색상 (순서대로 돌려 쓴다)
    const BAR_COLORS = [
      'bg-rose-400', 'bg-amber-400', 'bg-emerald-400', 'bg-sky-400',
      'bg-violet-400', 'bg-pink-400', 'bg-lime-400', 'bg-cyan-400',
      'bg-orange-400', 'bg-indigo-400',
    ];

    // API 호출 래퍼 — 서버의 { success, data, message } 규약을 그대로 다룬다
    async function api(pathname, options = {}) {
      const res = await fetch(`${API_BASE_URL}${pathname}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      let json = null;
      try {
        json = await res.json();
      } catch (_err) {
        throw new Error('서버 응답을 읽지 못했습니다.');
      }
      if (!res.ok || !json.success) {
        throw new Error(json?.message || `요청에 실패했습니다 (${res.status})`);
      }
      return json.data;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', className = '', ...props }) {
      const variants = {
        primary: 'bg-slate-900 text-white hover:bg-slate-700 disabled:bg-slate-400',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 disabled:text-slate-400',
        danger: 'bg-rose-600 text-white hover:bg-rose-500 disabled:bg-rose-300',
        ghost: 'text-slate-500 hover:bg-slate-100 hover:text-slate-800',
      };
      const sizes = {
        sm: 'px-2.5 py-1 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-5 py-2.5 text-base',
      };
      return (
        <button
          type="button"
          className={`rounded-lg font-medium transition-colors disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...props}
        />
      );
    }

    function Field({ label, error, required, children }) {
      return (
        <label className="block">
          {label && (
            <span className="mb-1 block text-xs font-semibold text-slate-600">
              {label}{required && <span className="ml-0.5 text-rose-500">*</span>}
            </span>
          )}
          {children}
          {error && <span className="mt-1 block text-xs text-rose-600">{error}</span>}
        </label>
      );
    }

    const CONTROL =
      'w-full rounded-lg border bg-white px-3 py-2 text-sm text-slate-800 outline-none transition-colors ' +
      'placeholder:text-slate-400 focus:border-slate-800 focus:ring-2 focus:ring-slate-200 disabled:bg-slate-100';

    function Input({ error, className = '', ...props }) {
      return <input className={`${CONTROL} ${error ? 'border-rose-400' : 'border-slate-300'} ${className}`} {...props} />;
    }

    function Select({ error, className = '', children, ...props }) {
      return (
        <select className={`${CONTROL} ${error ? 'border-rose-400' : 'border-slate-300'} ${className}`} {...props}>
          {children}
        </select>
      );
    }

    function Card({ className = '', children }) {
      return (
        <section className={`rounded-2xl border border-slate-200 bg-white p-5 shadow-sm ${className}`}>
          {children}
        </section>
      );
    }

    function Badge({ tone = 'slate', className = '', children }) {
      const tones = {
        slate: 'bg-slate-100 text-slate-600',
        emerald: 'bg-emerald-100 text-emerald-700',
        rose: 'bg-rose-100 text-rose-700',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, children }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 p-4"
          role="dialog"
          aria-modal="true"
          aria-label={title}
          onClick={onClose}
        >
          <div
            className="animate-fade-in-up w-full max-w-md rounded-2xl bg-white p-5 shadow-xl"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="mb-4 flex items-center justify-between">
              <h2 className="text-base font-bold text-slate-900">{title}</h2>
              <Button variant="ghost" size="sm" onClick={onClose} aria-label="닫기">✕</Button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function Spinner({ label = '불러오는 중…' }) {
      return (
        <div className="flex items-center justify-center gap-2 py-10 text-sm text-slate-400">
          <span className="h-4 w-4 animate-spin rounded-full border-2 border-slate-300 border-t-slate-600" />
          {label}
        </div>
      );
    }

    function EmptyState({ icon = '🗒️', title, description }) {
      return (
        <div className="py-12 text-center">
          <div className="text-3xl">{icon}</div>
          <p className="mt-2 text-sm font-semibold text-slate-600">{title}</p>
          {description && <p className="mt-1 text-xs text-slate-400">{description}</p>}
        </div>
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================

    function Header({ month, months, onMonthChange }) {
      return (
        <header className="border-b border-slate-200 bg-white">
          <div className="mx-auto flex max-w-5xl flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h1 className="text-xl font-extrabold tracking-tight text-slate-900">💰 가계부</h1>
              <p className="text-xs text-slate-500">수입·지출을 기록하고 카테고리별로 확인하세요</p>
            </div>
            <div className="sm:w-56">
              <Select value={month} onChange={(e) => onMonthChange(e.target.value)} aria-label="조회할 월 선택">
                <option value="">전체 기간</option>
                {months.map((m) => (
                  <option key={m} value={m}>{monthLabel(m)}</option>
                ))}
              </Select>
            </div>
          </div>
        </header>
      );
    }

    function ErrorBanner({ message, onDismiss }) {
      if (!message) return null;
      return (
        <div className="mb-4 flex items-start justify-between gap-3 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700" role="alert">
          <span>⚠️ {message}</span>
          <button type="button" onClick={onDismiss} className="text-rose-400 hover:text-rose-600" aria-label="알림 닫기">✕</button>
        </div>
      );
    }

    // ========================================
    // 📄 Summary (요약 + 카테고리별 합계)
    // ========================================

    function SummaryCards({ totals }) {
      const cards = [
        { label: '수입', value: totals.income, count: totals.incomeCount, tone: 'text-emerald-600', bg: 'bg-emerald-50', sign: '+' },
        { label: '지출', value: totals.expense, count: totals.expenseCount, tone: 'text-rose-600', bg: 'bg-rose-50', sign: '-' },
        {
          label: '잔액',
          value: Math.abs(totals.net),
          count: totals.incomeCount + totals.expenseCount,
          tone: totals.net < 0 ? 'text-rose-600' : 'text-slate-900',
          bg: 'bg-slate-50',
          sign: totals.net < 0 ? '-' : '',
        },
      ];
      return (
        <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
          {cards.map((c) => (
            <div key={c.label} className={`rounded-2xl border border-slate-200 ${c.bg} p-4 shadow-sm`}>
              <p className="text-xs font-semibold text-slate-500">{c.label}</p>
              <p className={`mt-1 text-xl font-extrabold tracking-tight ${c.tone}`}>
                {c.sign}{won(c.value)}
              </p>
              <p className="mt-0.5 text-xs text-slate-400">{c.count}건</p>
            </div>
          ))}
        </div>
      );
    }

    function CategoryBars({ title, rows, total, tone }) {
      if (rows.length === 0) {
        return (
          <div>
            <h3 className="mb-2 text-sm font-bold text-slate-800">{title}</h3>
            <p className="rounded-xl bg-slate-50 px-3 py-6 text-center text-xs text-slate-400">내역이 없습니다</p>
          </div>
        );
      }
      const max = Math.max(...rows.map((r) => r.total));
      return (
        <div>
          <div className="mb-3 flex items-baseline justify-between">
            <h3 className="text-sm font-bold text-slate-800">{title}</h3>
            <span className={`text-sm font-bold ${tone}`}>{won(total)}</span>
          </div>
          <ul className="space-y-2.5">
            {rows.map((row, i) => {
              const share = total > 0 ? Math.round((row.total / total) * 100) : 0;
              return (
                <li key={row.category}>
                  <div className="flex items-baseline justify-between text-xs">
                    <span className="font-medium text-slate-700">
                      {row.category}
                      <span className="ml-1.5 text-slate-400">{row.count}건</span>
                    </span>
                    <span className="text-slate-600">
                      {won(row.total)} <span className="text-slate-400">({share}%)</span>
                    </span>
                  </div>
                  <div className="mt-1 h-2 w-full overflow-hidden rounded-full bg-slate-100">
                    <div
                      className={`h-full rounded-full ${BAR_COLORS[i % BAR_COLORS.length]}`}
                      style={{ width: `${max > 0 ? Math.max((row.total / max) * 100, 3) : 0}%` }}
                    />
                  </div>
                </li>
              );
            })}
          </ul>
        </div>
      );
    }

    function SummaryPanel({ summary, loading }) {
      if (loading && !summary) return <Card><Spinner /></Card>;
      if (!summary) return null;

      const { totals, byCategory } = summary;
      return (
        <div className="space-y-4">
          <SummaryCards totals={totals} />
          <Card>
            <div className="grid grid-cols-1 gap-6 md:grid-cols-2">
              <CategoryBars title="지출 카테고리별 합계" rows={byCategory.expense} total={totals.expense} tone="text-rose-600" />
              <CategoryBars title="수입 카테고리별 합계" rows={byCategory.income} total={totals.income} tone="text-emerald-600" />
            </div>
          </Card>
        </div>
      );
    }

    // ========================================
    // 📄 Entry Form (등록 / 수정 공용)
    // ========================================

    const DIRECT_INPUT = '__direct__';

    function EntryForm({ categories, initial, submitLabel, onSubmit, onCancel, busy }) {
      const [type, setType] = useState(initial?.type || 'expense');
      const [entryDate, setEntryDate] = useState(initial?.entryDate || todayStr());
      const [amount, setAmount] = useState(initial ? String(initial.amount) : '');
      const [category, setCategory] = useState(initial?.category || '');
      const [customCategory, setCustomCategory] = useState('');
      const [memo, setMemo] = useState(initial?.memo || '');
      const [errors, setErrors] = useState({});

      const options = categories[type] || [];
      // 수정 대상 카테고리가 목록에 없으면 목록에 얹어서 선택 상태를 유지한다
      const optionList = category && !options.includes(category) && category !== DIRECT_INPUT
        ? [category, ...options]
        : options;

      // 구분(수입/지출)을 바꾸면 카테고리 목록이 달라지므로 선택을 초기화한다
      const changeType = (next) => {
        setType(next);
        setCategory('');
        setCustomCategory('');
      };

      const resolvedCategory = category === DIRECT_INPUT ? customCategory.trim() : category;

      const validate = () => {
        const next = {};
        if (!entryDate) next.entryDate = '날짜를 선택하세요.';
        const amountNum = Number(amount);
        if (!amount || !Number.isFinite(amountNum) || amountNum <= 0) {
          next.amount = '0보다 큰 금액을 입력하세요.';
        } else if (!Number.isInteger(amountNum)) {
          next.amount = '원 단위 정수로 입력하세요.';
        }
        if (!resolvedCategory) next.category = '카테고리를 선택하거나 입력하세요.';
        else if (resolvedCategory.length > 30) next.category = '카테고리는 30자 이하입니다.';
        setErrors(next);
        return Object.keys(next).length === 0;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (busy || !validate()) return;
        const ok = await onSubmit({
          type,
          entryDate,
          amount: Number(amount),
          category: resolvedCategory,
          memo: memo.trim(),
        });
        if (ok && !initial) {
          // 새 등록 후에는 날짜/구분은 유지하고 금액·메모만 비운다
          setAmount('');
          setMemo('');
          setErrors({});
        }
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-3">
          <div className="grid grid-cols-2 gap-2" role="group" aria-label="수입/지출 구분">
            {[
              { key: 'expense', label: '지출', on: 'bg-rose-600 text-white', off: 'bg-white text-slate-500 border border-slate-300' },
              { key: 'income', label: '수입', on: 'bg-emerald-600 text-white', off: 'bg-white text-slate-500 border border-slate-300' },
            ].map((t) => (
              <button
                key={t.key}
                type="button"
                aria-pressed={type === t.key}
                onClick={() => changeType(t.key)}
                className={`rounded-lg py-2 text-sm font-bold transition-colors ${type === t.key ? t.on : t.off}`}
              >
                {t.label}
              </button>
            ))}
          </div>

          <Field label="날짜" required error={errors.entryDate}>
            <Input type="date" value={entryDate} onChange={(e) => setEntryDate(e.target.value)} error={errors.entryDate} />
          </Field>

          <Field label="금액 (원)" required error={errors.amount}>
            <Input
              type="number"
              inputMode="numeric"
              min="1"
              step="1"
              placeholder="예: 12000"
              value={amount}
              onChange={(e) => setAmount(e.target.value)}
              error={errors.amount}
            />
            {amount && Number(amount) > 0 && (
              <span className="mt-1 block text-xs text-slate-400">{won(Number(amount))}</span>
            )}
          </Field>

          <Field label="카테고리" required error={errors.category}>
            <Select value={category} onChange={(e) => setCategory(e.target.value)} error={errors.category}>
              <option value="">선택하세요</option>
              {optionList.map((c) => (
                <option key={c} value={c}>{c}</option>
              ))}
              <option value={DIRECT_INPUT}>+ 직접 입력</option>
            </Select>
            {category === DIRECT_INPUT && (
              <Input
                className="mt-2"
                placeholder="새 카테고리 이름"
                maxLength={30}
                value={customCategory}
                onChange={(e) => setCustomCategory(e.target.value)}
              />
            )}
          </Field>

          <Field label="메모">
            <Input placeholder="선택 입력 (예: 점심 김치찌개)" maxLength={200} value={memo} onChange={(e) => setMemo(e.target.value)} />
          </Field>

          <div className="flex gap-2 pt-1">
            <Button type="submit" disabled={busy} className="flex-1">
              {busy ? '저장 중…' : submitLabel}
            </Button>
            {onCancel && <Button type="button" variant="secondary" onClick={onCancel}>취소</Button>}
          </div>
        </form>
      );
    }

    // ========================================
    // 📄 Entry List (내역 목록)
    // ========================================

    function EntryRow({ entry, onEdit, onDelete, deleting }) {
      const isIncome = entry.type === 'income';
      return (
        <li className="flex items-center gap-2 px-3 py-3 hover:bg-slate-50 sm:gap-3 sm:px-4">
          {/* 날짜는 그룹 헤더에 이미 있으므로 좁은 화면에서는 숨긴다 */}
          <div className="hidden w-16 shrink-0 text-xs text-slate-400 sm:block">{dayLabel(entry.entryDate)}</div>
          <div className="flex min-w-0 flex-1 items-center gap-2">
            <Badge tone={isIncome ? 'emerald' : 'rose'} className="shrink-0 whitespace-nowrap">
              {entry.category}
            </Badge>
            {entry.memo && <span className="truncate text-sm text-slate-600">{entry.memo}</span>}
          </div>
          <div className={`shrink-0 whitespace-nowrap text-sm font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}`}>
            {isIncome ? '+' : '-'}{won(entry.amount)}
          </div>
          <div className="flex shrink-0 gap-0.5 sm:gap-1">
            <Button variant="ghost" size="sm" className="px-1.5 sm:px-2.5" onClick={() => onEdit(entry)} aria-label="수정">✏️</Button>
            <Button variant="ghost" size="sm" className="px-1.5 sm:px-2.5" disabled={deleting} onClick={() => onDelete(entry)} aria-label="삭제">🗑️</Button>
          </div>
        </li>
      );
    }

    function EntryList({ entries, loading, filter, onFilterChange, categories, onEdit, onDelete, deletingId }) {
      // 날짜별로 묶어서 보여준다
      const groups = useMemo(() => {
        const map = new Map();
        for (const e of entries) {
          if (!map.has(e.entryDate)) map.set(e.entryDate, []);
          map.get(e.entryDate).push(e);
        }
        return [...map.entries()];
      }, [entries]);

      const allCategories = useMemo(() => {
        const set = new Set([...(categories.income || []), ...(categories.expense || [])]);
        return [...set];
      }, [categories]);

      return (
        <Card className="p-0">
          <div className="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center sm:justify-between">
            <h2 className="text-sm font-bold text-slate-800">
              내역 <span className="ml-1 text-xs font-normal text-slate-400">{entries.length}건</span>
            </h2>
            <div className="flex gap-2">
              <Select
                className="w-28"
                value={filter.type}
                onChange={(e) => onFilterChange({ ...filter, type: e.target.value })}
                aria-label="구분 필터"
              >
                <option value="">전체</option>
                <option value="income">수입</option>
                <option value="expense">지출</option>
              </Select>
              <Select
                className="w-40"
                value={filter.category}
                onChange={(e) => onFilterChange({ ...filter, category: e.target.value })}
                aria-label="카테고리 필터"
              >
                <option value="">모든 카테고리</option>
                {allCategories.map((c) => (
                  <option key={c} value={c}>{c}</option>
                ))}
              </Select>
            </div>
          </div>

          {loading ? (
            <Spinner />
          ) : entries.length === 0 ? (
            <EmptyState title="표시할 내역이 없습니다" description="왼쪽 폼에서 첫 수입·지출을 등록해 보세요." />
          ) : (
            <div className="divide-y divide-slate-100">
              {groups.map(([date, items]) => {
                const dayTotal = items.reduce((sum, e) => sum + (e.type === 'income' ? e.amount : -e.amount), 0);
                return (
                  <div key={date}>
                    <div className="flex items-center justify-between bg-slate-50 px-4 py-1.5 text-xs text-slate-500">
                      <span>{date}</span>
                      <span className={dayTotal < 0 ? 'text-rose-500' : 'text-emerald-600'}>
                        {dayTotal >= 0 ? '+' : '-'}{won(Math.abs(dayTotal))}
                      </span>
                    </div>
                    <ul className="divide-y divide-slate-100">
                      {items.map((e) => (
                        <EntryRow
                          key={e.id}
                          entry={e}
                          onEdit={onEdit}
                          onDelete={onDelete}
                          deleting={deletingId === e.id}
                        />
                      ))}
                    </ul>
                  </div>
                );
              })}
            </div>
          )}
        </Card>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      const [month, setMonth] = useState(thisMonthStr());
      const [filter, setFilter] = useState({ type: '', category: '' });

      const [entries, setEntries] = useState([]);
      const [summary, setSummary] = useState(null);
      const [months, setMonths] = useState([]);
      const [categories, setCategories] = useState({ income: [], expense: [] });

      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [deletingId, setDeletingId] = useState(null);
      const [error, setError] = useState('');
      const [editing, setEditing] = useState(null);

      // 응답이 순서 뒤바뀌어 도착해도 마지막 요청 결과만 반영한다
      const requestId = useRef(0);

      const query = useCallback((extra = {}) => {
        const params = new URLSearchParams();
        if (month) params.set('month', month);
        for (const [k, v] of Object.entries(extra)) if (v) params.set(k, v);
        const qs = params.toString();
        return qs ? `?${qs}` : '';
      }, [month]);

      const load = useCallback(async () => {
        const id = ++requestId.current;
        setLoading(true);
        try {
          const [entryData, summaryData, monthData, categoryData] = await Promise.all([
            api(`/entries${query({ type: filter.type, category: filter.category })}`),
            api(`/summary${query()}`),
            api('/months'),
            api('/categories'),
          ]);
          if (id !== requestId.current) return; // 더 최신 요청이 있으면 버린다
          setEntries(entryData);
          setSummary(summaryData);
          setMonths(monthData);
          setCategories(categoryData);
          setError('');
        } catch (err) {
          if (id !== requestId.current) return;
          setError(err.message);
        } finally {
          if (id === requestId.current) setLoading(false);
        }
      }, [query, filter.type, filter.category]);

      useEffect(() => { load(); }, [load]);

      // 이번 달에 내역이 없더라도 월 목록에는 현재 선택 월이 보이게 한다
      const monthOptions = useMemo(() => {
        const set = new Set(months);
        if (month) set.add(month);
        set.add(thisMonthStr());
        return [...set].sort().reverse();
      }, [months, month]);

      const createEntry = async (payload) => {
        setSaving(true);
        try {
          await api('/entries', { method: 'POST', body: JSON.stringify(payload) });
          // 다른 달 내역을 등록하면 그 달로 따라간다
          const targetMonth = payload.entryDate.slice(0, 7);
          if (month && targetMonth !== month) setMonth(targetMonth);
          else await load();
          setError('');
          return true;
        } catch (err) {
          setError(err.message);
          return false;
        } finally {
          setSaving(false);
        }
      };

      const updateEntry = async (payload) => {
        if (!editing) return false;
        setSaving(true);
        try {
          await api(`/entries/${editing.id}`, { method: 'PUT', body: JSON.stringify(payload) });
          setEditing(null);
          await load();
          setError('');
          return true;
        } catch (err) {
          setError(err.message);
          return false;
        } finally {
          setSaving(false);
        }
      };

      const deleteEntry = async (entry) => {
        if (!window.confirm(`${entry.entryDate} · ${entry.category} ${won(entry.amount)} 내역을 삭제할까요?`)) return;
        setDeletingId(entry.id);
        try {
          await api(`/entries/${entry.id}`, { method: 'DELETE' });
          await load();
          setError('');
        } catch (err) {
          setError(err.message);
        } finally {
          setDeletingId(null);
        }
      };

      return (
        <div className="min-h-screen">
          <Header month={month} months={monthOptions} onMonthChange={setMonth} />

          <main className="mx-auto max-w-5xl px-4 py-6">
            <ErrorBanner message={error} onDismiss={() => setError('')} />

            <div className="grid grid-cols-1 gap-5 lg:grid-cols-[320px_1fr]">
              <div className="space-y-4">
                <Card>
                  <h2 className="mb-3 text-sm font-bold text-slate-800">새 내역 등록</h2>
                  <EntryForm
                    categories={categories}
                    submitLabel="등록하기"
                    busy={saving}
                    onSubmit={createEntry}
                  />
                </Card>
              </div>

              <div className="space-y-5">
                <div>
                  <p className="mb-2 text-xs font-semibold text-slate-500">{monthLabel(month)} 요약</p>
                  <SummaryPanel summary={summary} loading={loading} />
                </div>

                <EntryList
                  entries={entries}
                  loading={loading}
                  filter={filter}
                  onFilterChange={setFilter}
                  categories={categories}
                  onEdit={setEditing}
                  onDelete={deleteEntry}
                  deletingId={deletingId}
                />
              </div>
            </div>
          </main>

          <Modal isOpen={!!editing} onClose={() => setEditing(null)} title="내역 수정">
            {editing && (
              <EntryForm
                key={editing.id}
                categories={categories}
                initial={editing}
                submitLabel="수정 저장"
                busy={saving}
                onSubmit={updateEntry}
                onCancel={() => setEditing(null)}
              />
            )}
          </Modal>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
