    // ========================================
    // 🪝 Hooks
    // ========================================
    // 요소 상단이 화면 하단 90% 지점을 지나면 .is-visible 을 붙여 페이드인
    // (빠르게 점프해 지나친 요소도 보이도록 IntersectionObserver 대신 위치로 판정)
    function useReveal() {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        let frame = 0;
        const check = () => {
          frame = 0;
          if (el.getBoundingClientRect().top < window.innerHeight * 0.9) {
            el.classList.add('is-visible');
            cleanup();
          }
        };
        const onScroll = () => { if (!frame) frame = requestAnimationFrame(check); };
        const cleanup = () => {
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('resize', onScroll);
          if (frame) cancelAnimationFrame(frame);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        check();
        return cleanup;
      }, []);
      return ref;
    }

    // 현재 보고 있는 섹션 id
    function useActiveSection(ids) {
      const [active, setActive] = useState('');
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) setActive(entry.target.id);
            });
          },
          { rootMargin: '-45% 0px -50% 0px' }
        );
        ids.forEach((id) => {
          const el = document.getElementById(id);
          if (el) observer.observe(el);
        });
        return () => observer.disconnect();
      }, [ids]);
      return active;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {

        primary: 'bg-sea-700 text-white hover:bg-sea-900 focus-visible:ring-sea-500',

        danger: 'bg-red-600 text-white hover:bg-red-700 focus-visible:ring-red-400',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-5 py-2.5 text-sm', lg: 'px-6 py-3 text-base' };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-full font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Card({ className = '', children }) {
      return (

      );
    }

    function Badge({ className = '', children }) {
      return (

          {children}
        </span>
      );
    }

    function Input({ id, type = 'text', label, value, onChange, placeholder, error, disabled = false, className = '', ...rest }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="mb-1.5 block text-sm font-semibold text-ink">{label}</label>}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={error ? 'true' : undefined}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-xl border bg-white px-4 py-3 text-base text-ink placeholder:text-ink/35 transition focus:outline-none focus:ring-2 disabled:bg-ink/5 ${error ? 'border-red-400 focus:ring-red-200' : 'border-ink/15 focus:border-sea-500 focus:ring-sea-100'}`}
            {...rest}
          />
          {error && <p id={`${id}-error`} className="mt-1.5 text-sm text-red-600">{error}</p>}
        </div>
      );
    }

    function Textarea({ id, label, value, onChange, placeholder, error, disabled = false, rows = 5, maxLength, className = '', ...rest }) {
      return (
        <div className={className}>
          {label && (
            <div className="mb-1.5 flex items-baseline justify-between">
              <label htmlFor={id} className="text-sm font-semibold text-ink">{label}</label>
              {maxLength && <span className="text-xs tabular-nums text-ink/40">{value.length} / {maxLength.toLocaleString()}</span>}
            </div>
          )}
          <textarea
            id={id}
            rows={rows}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            maxLength={maxLength}
            aria-invalid={error ? 'true' : undefined}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full resize-y rounded-xl border bg-white px-4 py-3 text-base leading-relaxed text-ink placeholder:text-ink/35 transition focus:outline-none focus:ring-2 disabled:bg-ink/5 ${error ? 'border-red-400 focus:ring-red-200' : 'border-ink/15 focus:border-sea-500 focus:ring-sea-100'}`}
            {...rest}
          />
          {error && <p id={`${id}-error`} className="mt-1.5 text-sm text-red-600">{error}</p>}
        </div>

    // 레이어 팝업: Esc·배경 클릭으로 닫힘, 열려 있는 동안 배경 스크롤 잠금, 닫으면 포커스 복귀
    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      const panelRef = useRef(null);

      useEffect(() => {
        if (!isOpen) return;
        const previouslyFocused = document.activeElement;
        const onKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
          if (e.key === 'Tab' && panelRef.current) {
            const focusables = panelRef.current.querySelectorAll('button, input, textarea, [href], [tabindex]:not([tabindex="-1"])');
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
        };
        const { overflow } = document.body.style;
        document.body.style.overflow = 'hidden';
        document.addEventListener('keydown', onKeyDown);
        panelRef.current?.querySelector('input, textarea, button')?.focus();
        return () => {
          document.body.style.overflow = overflow;
          document.removeEventListener('keydown', onKeyDown);
          previouslyFocused?.focus?.();
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl' };
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:items-center sm:p-6">
          <div className="modal-backdrop absolute inset-0 bg-ink/60 backdrop-blur-sm" onClick={onClose} aria-hidden="true" />
          <div
            ref={panelRef}
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
            className={`modal-panel relative max-h-[92vh] w-full overflow-y-auto rounded-t-3xl bg-sand p-6 shadow-2xl sm:rounded-3xl sm:p-8 ${sizes[size]}`}
          >
            <div className="mb-6 flex items-start justify-between gap-4">
              <h2 id="modal-title" className="text-2xl font-bold text-ink">{title}</h2>
              <button type="button" onClick={onClose} aria-label="닫기" className="-mr-2 -mt-1 rounded-full p-2 text-ink/50 transition hover:bg-ink/5 hover:text-ink">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function Spinner({ className = '' }) {
      return <span className={`inline-block h-4 w-4 animate-spin rounded-full border-2 border-current border-r-transparent ${className}`} aria-hidden="true" />;
    }

    function Reveal({ as: Tag = 'div', className = '', children }) {
      const ref = useReveal();
      return <Tag ref={ref} className={`reveal ${className}`}>{children}</Tag>;

    // 로딩 중엔 스켈레톤, 실패 시 대체 그라데이션
    function Photo({ image, className = '', imgClassName = '', caption = true }) {
      const [status, setStatus] = useState('loading');
      return (
        <figure className={`relative overflow-hidden rounded-3xl bg-sea-100 ${className}`}>
          {status === 'loading' && <div className="absolute inset-0 animate-pulse bg-sea-100" aria-hidden="true" />}

            <div className="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-sea-300 to-sea-700 p-6 text-center text-sm text-white/90" role="img" aria-label={image.alt}>
              {image.alt}
            </div>
          ) : (
            <img
              src={image.src}
              alt={image.alt}
              loading="lazy"
              onLoad={() => setStatus('loaded')}
              onError={() => setStatus('error')}
              className={`h-full w-full object-cover transition duration-700 ${status === 'loaded' ? 'opacity-100' : 'opacity-0'} ${imgClassName}`}

          )}
          {caption && status !== 'error' && (
            <figcaption className="absolute bottom-3 right-3 rounded-full bg-black/40 px-2.5 py-1 text-[10px] text-white/80 backdrop-blur">
              사진: Wikimedia Commons
            </figcaption>
          )}
        </figure>
      );
    }

          </p>

    }

    // ========================================
    // 🧩 Layout Components
    // ========================================
    function scrollToId(id) {
      document.getElementById(id)?.scrollIntoView({ block: 'start' });

    function Header() {
      const active = useActiveSection(NAV_ITEMS.map((n) => n.id));

        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const go = (id) => { setOpen(false); scrollToId(id); };

      return (
        <header className={`fixed inset-x-0 top-0 z-40 transition ${scrolled || open ? 'bg-sand/90 shadow-sm backdrop-blur' : 'bg-transparent'}`}>

                    onClick={() => go(item.id)}
                    aria-current={active === item.id ? 'true' : undefined}
                    className={`rounded-full px-4 py-2 text-sm font-medium transition ${active === item.id ? 'bg-sea-700 text-white' : 'text-ink/70 hover:bg-ink/5 hover:text-ink'}`}
                  >
                    {item.label}
                  </button>
                </li>
              ))}
            </ul>
            <button

              className="rounded-lg p-2 text-ink md:hidden"
              aria-expanded={open}
              aria-controls="mobile-nav"
              aria-label={open ? '메뉴 닫기' : '메뉴 열기'}
              onClick={() => setOpen((v) => !v)}
            >
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                {open ? <path d="M6 6l12 12M18 6L6 18" /> : <path d="M4 7h16M4 12h16M4 17h16" />}
              </svg>
            </button>
          </nav>
          {open && (
            <ul id="mobile-nav" className="border-t border-ink/5 px-5 pb-4 md:hidden">
              {NAV_ITEMS.map((item) => (
                <li key={item.id}>
                  <button type="button" onClick={() => go(item.id)} className={`block w-full py-3 text-left text-base ${active === item.id ? 'font-bold text-sea-700' : 'text-ink/80'}`}>
                    {item.label}
                  </button>
                </li>
              ))}
            </ul>
          )}
        </header>
      );
    }

    function Footer() {
      return (
        <footer className="bg-sea-900 px-5 py-12 text-sea-100 sm:px-8">
          <div className="mx-auto max-w-6xl">

    // ========================================
    // ✉️ Contact (문의하기)
    // ========================================
    const CONTACT_LIMITS = { name: 50, content: 2000 };
    const EMPTY_FORM = { name: '', email: '', content: '' };

    function validateContact(form) {
      const errors = {};
      if (!form.name.trim()) errors.name = '이름을 입력해 주세요.';
      if (!form.email.trim()) errors.email = '이메일을 입력해 주세요.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) errors.email = '올바른 이메일 형식이 아닙니다.';
      if (!form.content.trim()) errors.content = '문의 내용을 입력해 주세요.';
      return errors;
    }

    function ContactModal({ isOpen, onClose }) {
      const [form, setForm] = useState(EMPTY_FORM);
      const [errors, setErrors] = useState({});
      const [status, setStatus] = useState('idle'); // idle | submitting | done
      const [serverError, setServerError] = useState('');

      // 닫았다 다시 열면 새 문의로 시작 (작성 중이던 내용은 완료 전까지 유지)
      useEffect(() => {
        if (isOpen && status === 'done') {
          setForm(EMPTY_FORM);
          setStatus('idle');
        }
      }, [isOpen]);

      const update = (field) => (e) => {
        setForm((f) => ({ ...f, [field]: e.target.value }));
        if (errors[field]) setErrors((prev) => ({ ...prev, [field]: undefined }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        const nextErrors = validateContact(form);
        setErrors(nextErrors);
        setServerError('');
        if (Object.keys(nextErrors).length) return;

        setStatus('submitting');
        try {
          const res = await fetch(`${API_BASE_URL}/messages`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form),
          });
          const json = await res.json().catch(() => ({}));
          if (!res.ok || !json.success) throw new Error(json.message || '문의를 보내지 못했습니다.');
          setStatus('done');
        } catch (err) {
          setServerError(err.message === 'Failed to fetch' ? '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.' : err.message);
          setStatus('idle');
        }
      };

      const submitting = status === 'submitting';

      return (
        <Modal isOpen={isOpen} onClose={onClose} title={status === 'done' ? '문의가 접수되었습니다' : '문의하기'}>
          {status === 'done' ? (
            <div className="text-center">
              <div className="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-sea-100 text-3xl" aria-hidden="true">✉️</div>
              <p className="mt-5 leading-relaxed text-ink/70">
                <strong className="text-ink">{form.name}</strong>님, 소중한 문의 감사합니다.<br />
                남겨주신 <strong className="text-ink">{form.email}</strong>로 답변 드리겠습니다.
              </p>
              <Button size="lg" className="mt-8 w-full" onClick={onClose}>확인</Button>
            </div>
          ) : (
            <form onSubmit={handleSubmit} noValidate className="space-y-4">
              <p className="-mt-3 mb-2 text-sm text-ink/60">궁금한 점이나 함께하고 싶은 이야기가 있다면 편하게 남겨 주세요.</p>
              <Input id="contact-name" label="이름" value={form.name} onChange={update('name')} placeholder="홍길동" maxLength={CONTACT_LIMITS.name} error={errors.name} disabled={submitting} autoComplete="name" />
              <Input id="contact-email" type="email" label="이메일" value={form.email} onChange={update('email')} placeholder="you@example.com" error={errors.email} disabled={submitting} autoComplete="email" />
              <Textarea id="contact-content" label="내용" value={form.content} onChange={update('content')} placeholder="문의 내용을 입력해 주세요." maxLength={CONTACT_LIMITS.content} rows={6} error={errors.content} disabled={submitting} />
              {serverError && (
                <p role="alert" className="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{serverError}</p>
              )}
              <div className="flex gap-3 pt-2">
                <Button variant="secondary" size="lg" className="flex-1" onClick={onClose} disabled={submitting}>취소</Button>
                <Button type="submit" size="lg" className="flex-[2]" disabled={submitting}>
                  {submitting ? <><Spinner /> 보내는 중…</> : '문의 보내기'}
                </Button>
              </div>
            </form>
          )}
        </Modal>
      );
    }

    function ContactSection() {
      const [open, setOpen] = useState(false);
      const close = useCallback(() => setOpen(false), []);
      return (
        <section id="contact" className="scroll-mt-20 px-5 pb-24 sm:px-8">

    // ========================================
    // 🛠️ Admin (문의 목록)
    // ========================================
    const dateFormatter = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', dateStyle: 'medium', timeStyle: 'short' });

    function timeAgo(iso) {
      const sec = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
      if (sec < 60) return '방금 전';
      if (sec < 3600) return `${Math.floor(sec / 60)}분 전`;
      if (sec < 86400) return `${Math.floor(sec / 3600)}시간 전`;
      if (sec < 86400 * 30) return `${Math.floor(sec / 86400)}일 전`;
      return null;
    }

    // ── 경로 이동 (새로고침 없이 /admin ↔ /admin/login 전환) ──
    function navigate(to, { replace = false } = {}) {
      window.history[replace ? 'replaceState' : 'pushState']({}, '', to);
      window.dispatchEvent(new PopStateEvent('popstate'));
    }

    function usePathname() {
      const [pathname, setPathname] = useState(window.location.pathname);
      useEffect(() => {
        const onPop = () => setPathname(window.location.pathname);
        window.addEventListener('popstate', onPop);
        // 자식 effect 가 먼저 실행되므로, 리스너를 붙이기 전에 일어난 이동(첫 렌더 중 리다이렉트)을 반영한다.
        onPop();
        return () => window.removeEventListener('popstate', onPop);
      }, []);
      return pathname.replace(/\/+$/, '') || '/';
    }

    // ── 관리자 토큰 보관 (sessionStorage: 브라우저를 닫으면 로그아웃) ──
    const TOKEN_KEY = 'about-me:admin-token';
    const auth = {
      get() {
        try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; }
      },
      set(token) {
        try { sessionStorage.setItem(TOKEN_KEY, token); } catch {}
      },
      clear() {
        try { sessionStorage.removeItem(TOKEN_KEY); } catch {}
      },
      // 표시용으로만 토큰 안의 아이디·만료시각을 읽는다 (진짜 검증은 서버가 한다)
      payload() {
        try {
          const part = auth.get().split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
          const data = JSON.parse(atob(part));
          return data.exp > Date.now() ? data : null;
        } catch { return null; }
      },
    };

    function AdminLoginPage() {
      const expired = new URLSearchParams(window.location.search).has('expired');
      const [form, setForm] = useState({ id: '', password: '' });
      const [showPassword, setShowPassword] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        document.title = '관리자 로그인 | 박건우';
        if (auth.payload()) navigate('/admin', { replace: true }); // 이미 로그인 상태
      }, []);

      const update = (field) => (e) => {
        setForm((f) => ({ ...f, [field]: e.target.value }));
        if (error) setError('');
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!form.id.trim() || !form.password) {
          setError('아이디와 비밀번호를 입력해 주세요.');
          return;
        }
        setSubmitting(true);
        setError('');
        try {
          const res = await fetch(`${API_BASE_URL}/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form),
          });
          const json = await res.json().catch(() => ({}));
          if (!res.ok || !json.success) throw new Error(json.message || '로그인에 실패했습니다.');
          auth.set(json.data.token);
          navigate('/admin', { replace: true });
        } catch (err) {
          setError(err.message === 'Failed to fetch' ? '서버에 연결할 수 없습니다. server.js 가 실행 중인지 확인해 주세요.' : err.message);
          setForm((f) => ({ ...f, password: '' }));
          setSubmitting(false);
        }
      };

      return (
        <div className="flex min-h-screen flex-col items-center justify-center px-5 py-12">
          <div className="w-full max-w-sm">
            <Card className="p-8">
              <h1 className="text-2xl font-bold">관리자 로그인</h1>
              <p className="mt-1 text-sm text-ink/60">문의 목록은 관리자만 볼 수 있습니다.</p>

              {expired && !error && (
                <p role="status" className="mt-5 rounded-xl bg-sea-50 px-4 py-3 text-sm text-sea-700">
                  로그인 시간이 만료되었습니다. 다시 로그인해 주세요.
                </p>
              )}

              <form onSubmit={handleSubmit} noValidate className="mt-6 space-y-4">
                <Input id="admin-id" label="아이디" value={form.id} onChange={update('id')} placeholder="아이디" disabled={submitting} autoComplete="username" autoCapitalize="none" spellCheck={false} />
                <div className="relative">
                  <Input
                    id="admin-password"
                    type={showPassword ? 'text' : 'password'}
                    label="비밀번호"
                    value={form.password}
                    onChange={update('password')}
                    placeholder="비밀번호"
                    disabled={submitting}
                    autoComplete="current-password"
                    className="[&_input]:pr-16"
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword((v) => !v)}
                    aria-pressed={showPassword}
                    aria-controls="admin-password"
                    className="absolute bottom-2 right-2 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-ink/50 hover:bg-ink/5 hover:text-ink"
                  >
                    {showPassword ? '숨기기' : '보기'}
                  </button>
                </div>
                {error && <p role="alert" className="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{error}</p>}
                <Button type="submit" size="lg" className="w-full" disabled={submitting}>
                  {submitting ? <><Spinner /> 확인 중…</> : '로그인'}
                </Button>
              </form>
            </Card>
            <a href="/" className="mt-6 block text-center text-sm text-ink/50 hover:text-ink">← 사이트로 돌아가기</a>
          </div>
        </div>
      );
    }

    function AdminPage() {
      const session = auth.payload();
      const [messages, setMessages] = useState([]);
      const [source, setSource] = useState('');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');

      const logout = useCallback((reason) => {
        auth.clear();
        navigate(reason === 'expired' ? '/admin/login?expired=1' : '/admin/login', { replace: true });
      }, []);

      const load = useCallback(async () => {
        setLoading(true);
        setError('');
        try {
          const res = await fetch(`${API_BASE_URL}/messages`, {
            headers: { Authorization: `Bearer ${auth.get()}` },
          });
          if (res.status === 401) return logout('expired');
          const json = await res.json().catch(() => ({}));
          if (!res.ok || !json.success) throw new Error(json.message || '문의 목록을 불러오지 못했습니다.');
          const sorted = [...json.data].sort((a, b) => new Date(b.received_at) - new Date(a.received_at));
          setMessages(sorted);
          setSource(json.source);
        } catch (err) {
          setError(err.message === 'Failed to fetch' ? '서버에 연결할 수 없습니다. server.js 가 실행 중인지 확인해 주세요.' : err.message);
        } finally {
          setLoading(false);
        }
      }, [logout]);

      useEffect(() => {
        document.title = '문의 관리 | 박건우';
        if (!session) return logout(); // 로그인 안 했거나 만료 → 로그인 페이지로
        load();
      }, [load]);

      if (!session) return null;

      return (
        <div className="min-h-screen">
          <header className="sticky top-0 z-40 border-b border-ink/5 bg-sand/90 backdrop-blur">
            <div className="mx-auto flex max-w-4xl items-center justify-between gap-3 px-5 py-4 sm:px-8">
              <span className="text-base font-bold tracking-tight text-ink">관리자</span>
              <div className="flex items-center gap-1 sm:gap-3">
                <span className="hidden text-sm text-ink/60 sm:inline"><strong className="font-semibold text-ink">{session.sub}</strong> 님</span>
                <a href="/" className="rounded-full px-3 py-2 text-sm font-medium text-ink/60 hover:bg-ink/5 hover:text-ink">사이트로</a>
                <Button variant="secondary" size="sm" onClick={() => logout()}>로그아웃</Button>
              </div>
            </div>
          </header>

          <main className="mx-auto max-w-4xl px-5 py-10 sm:px-8">
            <div className="mb-8 flex flex-wrap items-end justify-between gap-4">
              <div>
                <h1 className="text-3xl font-bold">문의 목록</h1>
                <p className="mt-1 text-sm text-ink/60">
                  {loading ? '불러오는 중…' : `총 ${messages.length}건 · 최신순`}
                  {!loading && source && <Badge className="ml-2">{source === 'database' ? 'Supabase DB' : 'messages.json'}</Badge>}
                </p>
              </div>
              <Button variant="secondary" onClick={load} disabled={loading}>
                {loading ? <Spinner /> : '↻'} 새로고침
              </Button>
            </div>

            {error ? (
              <Card className="text-center">
                <p className="text-red-600">{error}</p>
                <Button className="mt-4" onClick={load}>다시 시도</Button>
              </Card>
            ) : loading && messages.length === 0 ? (
              <ul className="space-y-4" aria-hidden="true">
                {[0, 1, 2].map((i) => <li key={i} className="h-36 animate-pulse rounded-2xl bg-white/70" />)}
              </ul>
            ) : messages.length === 0 ? (
              <Card className="py-16 text-center">
                <p className="text-4xl" aria-hidden="true">📭</p>
                <p className="mt-4 font-semibold">아직 받은 문의가 없습니다.</p>
                <p className="mt-1 text-sm text-ink/60">사이트 하단의 문의하기로 접수된 내용이 여기에 표시됩니다.</p>
              </Card>
            ) : (
              <ul className="space-y-4">
                {messages.map((m) => {
                  const ago = timeAgo(m.received_at);
                  return (
                    <li key={m.id}>
                      <Card>
                        <div className="flex flex-wrap items-start justify-between gap-2">
                          <div className="min-w-0">
                            <p className="font-bold">{m.name}</p>
                            <a href={`mailto:${m.email}`} className="break-all text-sm text-sea-600 hover:underline">{m.email}</a>
                          </div>
                          <time dateTime={m.received_at} className="text-right text-sm text-ink/50">
                            {dateFormatter.format(new Date(m.received_at))}
                            {ago && <span className="block text-xs text-ink/40">{ago}</span>}
                          </time>
                        </div>
                        <p className="mt-4 whitespace-pre-wrap break-words rounded-xl bg-sand p-4 text-sm leading-relaxed text-ink/80">{m.content}</p>
                      </Card>
                    </li>
                  );
                })}
              </ul>
            )}
          </main>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function HomePage() {
      return (
        <>
          <a href="#main" className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded focus:bg-white focus:px-4 focus:py-2">
            본문 바로가기
          </a>
          <Header />
          <main id="main">
            <Hero />
            <Waves />
            <SeaSection />
            <StudySection />
            <CareerSection />
            <CodingSection />
            <GoalsSection />
            <ContactSection />
          </main>
          <Footer />
        </>
      );
    }

    // 서버가 모든 경로에 index.html 을 내려주므로, 경로를 보고 화면을 고른다.
    //   /             → 자기소개
    //   /admin/login  → 관리자 로그인
    //   /admin        → 문의 목록 (로그인 필요)
    function App() {
      const pathname = usePathname();
      if (pathname === '/admin/login') return <AdminLoginPage />;
      if (pathname === '/admin') return <AdminPage />;
      return <HomePage />;
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
