  <!-- ⚠️ 모든 CDN 버전 고정 (Babel 은 반드시 7.x — 8.x 는 인라인 text/babel 미지원) -->

    .animate-slide-up { animation: slideUp .22s ease-out both; }

<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
// ========================================
// React Hooks
// ========================================
const { useState, useMemo, useEffect, useCallback, useRef, createContext, useContext } = React;


// ========================================
// 💰 세법 상수 (2024 / 2025 귀속 기준)
// ========================================

/** 종합소득세 기본세율 — 소득세법 제55조 (2023 귀속 이후 현행) */
const TAX_BRACKETS = [
  { upto: 14000000,   rate: 0.06, quick: 0 },
  { upto: 50000000,   rate: 0.15, quick: 1260000 },
  { upto: 88000000,   rate: 0.24, quick: 5760000 },
  { upto: 150000000,  rate: 0.35, quick: 15440000 },
  { upto: 300000000,  rate: 0.38, quick: 19940000 },
  { upto: 500000000,  rate: 0.40, quick: 25940000 },
  { upto: 1000000000, rate: 0.42, quick: 35940000 },
  { upto: Infinity,   rate: 0.45, quick: 65940000 },
];

/** 지방소득세(소득분) = 소득세 결정세액의 10% */
const LOCAL_TAX_RATE = 0.1;

/** 인적공제 단가 — 소득세법 제50조~제51조 */
const PERSONAL = {
  basic: 1500000,        // 기본공제 1인당
  elderly: 1000000,      // 경로우대 (70세 이상)
  disabled: 2000000,     // 장애인
  female: 500000,        // 부녀자
  singleParent: 1000000, // 한부모
};

/** 간이과세자 업종별 부가가치율 — 부가가치세법 시행령 제111조 (2021.7.1~) */
const SIMPLE_VAT_RATES = [
  { key: 'retail',  rate: 0.15, label: '소매업 · 음식점업 · 재생용 재료수집판매업' },
  { key: 'mfg',     rate: 0.20, label: '제조업 · 농림어업 · 소화물 전문 운송업' },
  { key: 'lodging', rate: 0.25, label: '숙박업' },
  { key: 'constr',  rate: 0.30, label: '건설업 · 운수창고업 · 정보통신업 · 그 밖의 서비스업' },
  { key: 'prof',    rate: 0.40, label: '금융보험 · 전문과학기술 · 사업시설관리 · 부동산관련 · 임대업' },
];

/** 의제매입세액 공제율 — 부가가치세법 제42조 */
const DEEMED_RATES = [
  { key: 'food_ind1', num: 9, den: 109, food: true,  label: '음식점업 (개인, 과세표준 2억원 이하)' },
  { key: 'food_ind2', num: 8, den: 108, food: true,  label: '음식점업 (개인, 과세표준 2억원 초과)' },
  { key: 'food_corp', num: 6, den: 106, food: true,  label: '음식점업 (법인)' },
  { key: 'mfg_small', num: 6, den: 106, food: false, label: '제조업 (과자점 · 도정 · 제분 · 떡방앗간 등 개인)' },
  { key: 'mfg',       num: 4, den: 104, food: false, label: '그 밖의 제조업' },
  { key: 'etc',       num: 2, den: 102, food: false, label: '그 밖의 업종' },
];

/** 간이과세 납부의무 면제 기준 (해당 과세기간 공급대가) */
const SIMPLE_EXEMPT_THRESHOLD = 48000000;
/** 간이과세 적용 기준 (직전연도 공급대가, 2024.7.1~) */
const SIMPLE_ELIGIBLE_THRESHOLD = 104000000;


// ========================================
// 🔢 포맷 유틸
// ========================================
const won0 = (n) => Math.round(n || 0).toLocaleString('ko-KR');
const won = (n) => won0(n) + '원';
const pct = (n, digits = 2) => (n * 100).toFixed(digits) + '%';

/** 12345678 → "1,234만 5,678원" 형태의 한글 금액 표기 */
function toKoreanAmount(value) {
  let n = Math.round(value || 0);
  if (n === 0) return '0원';
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  const eok = Math.floor(n / 100000000);
  const man = Math.floor((n % 100000000) / 10000);
  const rest = n % 10000;
  const parts = [];
  if (eok) parts.push(eok.toLocaleString('ko-KR') + '억');
  if (man) parts.push(man.toLocaleString('ko-KR') + '만');
  if (rest) parts.push(rest.toLocaleString('ko-KR'));
  return sign + parts.join(' ') + '원';
}


// ========================================
// 🧮 종합소득세 계산 엔진
// ========================================

/** 근로소득공제 — 소득세법 제47조 (한도 2,000만원) */
function laborIncomeDeduction(gross) {
  if (gross <= 0) return 0;
  let d;
  if (gross <= 5000000) d = gross * 0.7;
  else if (gross <= 15000000) d = 3500000 + (gross - 5000000) * 0.4;
  else if (gross <= 45000000) d = 7500000 + (gross - 15000000) * 0.15;
  else if (gross <= 100000000) d = 12000000 + (gross - 45000000) * 0.05;
  else d = 14750000 + (gross - 100000000) * 0.02;
  return Math.min(d, 20000000);
}

/** 과세표준에 대한 산출세액 (누진공제 방식) */
function progressiveTax(base) {
  if (base <= 0) return 0;
  const b = TAX_BRACKETS.find((x) => base <= x.upto);
  return base * b.rate - b.quick;
}

/** 현재 적용 한계세율 구간 */
function currentBracket(base) {
  if (base <= 0) return TAX_BRACKETS[0];
  return TAX_BRACKETS.find((x) => base <= x.upto);
}

/** 과세표준을 세율 구간별로 쪼갠 내역 (세액 구성 시각화용) */
function bracketSlices(base) {
  const slices = [];
  let lower = 0;
  for (let i = 0; i < TAX_BRACKETS.length; i++) {
    const b = TAX_BRACKETS[i];
    if (base <= lower) break;
    const upper = Math.min(base, b.upto);
    const amount = upper - lower;
    if (amount > 0) slices.push({ from: lower, to: upper, amount, rate: b.rate, tax: amount * b.rate });
    lower = b.upto;
  }
  return slices;
}

/** 근로소득세액공제 — 소득세법 제59조 */
function laborTaxCredit(taxOnLabor, gross) {
  if (taxOnLabor <= 0) return 0;
  const raw = taxOnLabor <= 1300000
    ? taxOnLabor * 0.55
    : 715000 + (taxOnLabor - 1300000) * 0.30;
  let cap;
  if (gross <= 33000000) cap = 740000;
  else if (gross <= 70000000) cap = Math.max(660000, 740000 - (gross - 33000000) * 0.008);
  else if (gross <= 120000000) cap = Math.max(500000, 660000 - (gross - 70000000) * 0.5);
  else cap = Math.max(200000, 500000 - (gross - 120000000) * 0.5);
  return Math.min(raw, cap);
}

/** 자녀세액공제 — 8세 이상 20세 이하 (2025 귀속부터 인상) */
function childTaxCredit(count, year) {
  if (count <= 0) return 0;
  const table = year >= 2025 ? [250000, 300000, 400000] : [150000, 200000, 300000];
  let sum = 0;
  for (let i = 0; i < count; i++) sum += table[Math.min(i, 2)];
  return sum;
}

/** 출산·입양 세액공제 (첫째 30 / 둘째 50 / 셋째 이상 70만원) */
function birthTaxCredit(order) {
  if (order === 1) return 300000;
  if (order === 2) return 500000;
  if (order >= 3) return 700000;
  return 0;
}

/** 노란우산공제(소기업·소상공인 공제부금) 소득공제 한도 */
function noranLimit(businessIncome) {
  if (businessIncome <= 40000000) return 5000000;
  if (businessIncome <= 100000000) return 3000000;
  return 2000000;
}

/**
 * 종합소득세 전체 계산.
 * 화면에 단계별 근거를 그대로 표시하기 위해 중간 산출물을 모두 반환한다.
 */
function calcIncomeTax(f) {
  const year = f.year;

  // ── 1. 소득금액 ──────────────────────────────────────
  const laborDeduction = laborIncomeDeduction(f.salary);
  const laborIncome = Math.max(0, f.salary - laborDeduction);        // 근로소득금액
  const businessIncome = Math.max(0, f.bizRevenue - f.bizExpense);   // 사업소득금액
  const otherIncome = Math.max(0, f.otherIncome);                    // 기타소득금액
  const financialIncome = Math.max(0, f.financialIncome);            // 종합과세 대상 금융소득
  const totalIncome = laborIncome + businessIncome + otherIncome + financialIncome;

  // ── 2. 소득공제 ──────────────────────────────────────
  const dependents = 1 + (f.hasSpouse ? 1 : 0) + f.dependentCount;   // 본인 + 배우자 + 부양가족
  const basicDeduction = dependents * PERSONAL.basic;
  const elderlyDeduction = f.elderlyCount * PERSONAL.elderly;
  const disabledDeduction = f.disabledCount * PERSONAL.disabled;
  // 한부모공제와 부녀자공제 중복 시 한부모 우선, 부녀자는 종합소득금액 3,000만원 이하만
  const singleParentDeduction = f.singleParent ? PERSONAL.singleParent : 0;
  const femaleDeduction = (!f.singleParent && f.femaleHead && totalIncome <= 30000000) ? PERSONAL.female : 0;
  const personalTotal = basicDeduction + elderlyDeduction + disabledDeduction + femaleDeduction + singleParentDeduction;

  const pensionInsurance = Math.max(0, f.nationalPension);                                    // 연금보험료공제 (전액)
  const specialDeduction = Math.max(0, f.healthInsurance) + Math.max(0, f.housingDeduction);  // 특별소득공제
  const noranApplied = Math.min(Math.max(0, f.noran), noranLimit(businessIncome));
  const cardDeduction = Math.max(0, f.cardDeduction);
  const otherDeductionTotal = noranApplied + cardDeduction;

  const deductionTotal = personalTotal + pensionInsurance + specialDeduction + otherDeductionTotal;
  const taxBase = Math.max(0, totalIncome - deductionTotal);         // 과세표준

  // ── 3. 산출세액 ──────────────────────────────────────
  const computedTax = progressiveTax(taxBase);
  const slices = bracketSlices(taxBase);
  const bracket = currentBracket(taxBase);

  // ── 4. 세액공제 ──────────────────────────────────────
  // 근로소득세액공제는 산출세액 중 근로소득이 차지하는 비중만큼 안분
  const laborRatio = totalIncome > 0 ? laborIncome / totalIncome : 0;
  const creditLabor = f.salary > 0 ? laborTaxCredit(computedTax * laborRatio, f.salary) : 0;

  const childCredit = childTaxCredit(f.childCount, year);
  const birthCredit = birthTaxCredit(f.birthOrder);
  const creditChild = childCredit + birthCredit;

  // 연금계좌: 연금저축 600만원 + 퇴직연금(IRP) 합산 900만원 한도
  const pensionBase = Math.min(Math.min(f.pensionSaving, 6000000) + f.irp, 9000000);
  const pensionHighRate = f.salary > 0
    ? (f.salary <= 55000000)          // 근로자: 총급여 5,500만원 이하
    : (totalIncome <= 45000000);      // 그 외: 종합소득금액 4,500만원 이하
  const pensionRate = pensionHighRate ? 0.15 : 0.12;
  const creditPension = pensionBase * pensionRate;

  // 특별세액공제 (근로소득자만 적용)
  const isEmployee = f.salary > 0;
  const insuranceCredit = isEmployee ? Math.min(f.insurancePremium, 1000000) * 0.12 : 0;
  const medicalThreshold = f.salary * 0.03;                                        // 총급여 3% 문턱
  const medicalEligible = isEmployee ? Math.min(Math.max(0, f.medical - medicalThreshold), 7000000) : 0;
  const medicalCredit = medicalEligible * 0.15;
  const educationCredit = isEmployee ? f.education * 0.15 : 0;
  const donationCredit = f.donation <= 10000000
    ? f.donation * 0.15
    : 10000000 * 0.15 + (f.donation - 10000000) * 0.30;
  // 월세액 세액공제: 총급여 5,500만원 이하 17%, 8,000만원 이하 15% (연 1,000만원 한도)
  const rentRate = f.salary <= 55000000 ? 0.17 : (f.salary <= 80000000 ? 0.15 : 0);
  const rentCredit = isEmployee ? Math.min(f.monthlyRent, 10000000) * rentRate : 0;

  const specialCreditSum = insuranceCredit + medicalCredit + educationCredit + donationCredit + rentCredit;
  // 표준세액공제: 근로자 13만원 / 그 밖의 종합소득자 7만원
  const standardCredit = isEmployee ? 130000 : 70000;
  const useStandard = isEmployee
    ? (specialDeduction + specialCreditSum) < standardCredit
    : specialCreditSum < standardCredit;
  const creditSpecial = useStandard ? standardCredit : specialCreditSum;

  const creditTotal = creditLabor + creditChild + creditPension + creditSpecial;

  // ── 5. 결정세액 · 납부(환급)세액 ─────────────────────
  const determinedTax = Math.max(0, computedTax - creditTotal);
  const localTax = determinedTax * LOCAL_TAX_RATE;
  const totalBurden = determinedTax + localTax;
  const finalPayable = totalBurden - Math.max(0, f.prepaid);        // 음수면 환급

  const grossReceipts = f.salary + f.bizRevenue + otherIncome + financialIncome;
  const effectiveRate = grossReceipts > 0 ? totalBurden / grossReceipts : 0;

  return {
    laborDeduction, laborIncome, businessIncome, otherIncome, financialIncome, totalIncome,
    dependents, basicDeduction, elderlyDeduction, disabledDeduction, femaleDeduction, singleParentDeduction,
    personalTotal, pensionInsurance, specialDeduction, noranApplied, cardDeduction, otherDeductionTotal,
    deductionTotal, taxBase, computedTax, slices, bracket,
    creditLabor, childCredit, birthCredit, creditChild, pensionBase, pensionRate, creditPension,
    insuranceCredit, medicalCredit, medicalThreshold, medicalEligible, educationCredit, donationCredit,
    rentCredit, rentRate, specialCreditSum, standardCredit, useStandard, creditSpecial, creditTotal,
    determinedTax, localTax, totalBurden, finalPayable, effectiveRate, grossReceipts, isEmployee,
  };
}


// ========================================
// 🧮 부가가치세 계산 엔진
// ========================================

/** 일반과세자 */
function calcGeneralVat(f) {
  const salesVat = f.taxableSales * 0.1;                 // 매출세액 (영세율 매출은 세율 0%)
  const purchaseVat = f.purchases * 0.1;                 // 매입세액
  const nonDeductible = Math.max(0, f.nonDeductible);    // 공제받지 못할 매입세액
  const deductiblePurchaseVat = Math.max(0, purchaseVat - nonDeductible);

  // 의제매입세액 — 과세표준 × 한도율 기준의 공제한도 적용
  const rateInfo = DEEMED_RATES.find((r) => r.key === f.deemedType) || DEEMED_RATES[0];
  const factor = rateInfo.num / rateInfo.den;
  const deemedRaw = f.useDeemed ? f.deemedPurchase * factor : 0;
  let limitRate;
  if (f.entityType === 'corp') limitRate = 0.5;
  else if (rateInfo.food) limitRate = f.taxableSales <= 100000000 ? 0.75 : (f.taxableSales <= 200000000 ? 0.70 : 0.60);
  else limitRate = f.taxableSales <= 200000000 ? 0.65 : 0.55;
  const deemedLimit = f.taxableSales * limitRate * factor;
  const deemedCredit = f.useDeemed ? Math.min(deemedRaw, deemedLimit) : 0;

  // 신용카드매출전표등 발행세액공제 1.3% (개인사업자, 연 1,000만원 한도)
  const cardCredit = f.entityType === 'individual' ? Math.min(f.cardSales * 0.013, 10000000) : 0;
  const eFilingCredit = f.eFiling ? 10000 : 0;

  const creditTotal = deductiblePurchaseVat + deemedCredit + cardCredit + eFilingCredit;
  const payableBefore = salesVat - creditTotal;
  const finalPayable = payableBefore - Math.max(0, f.prepaid);

  return {
    salesVat, purchaseVat, nonDeductible, deductiblePurchaseVat,
    deemedRaw, deemedLimit, deemedCredit, rateInfo, limitRate,
    cardCredit, eFilingCredit, creditTotal, payableBefore, finalPayable,
  };
}

/** 간이과세자 */
function calcSimpleVat(f) {
  const info = SIMPLE_VAT_RATES.find((r) => r.key === f.industry) || SIMPLE_VAT_RATES[0];
  const supply = f.supplyPrice;                              // 공급대가 (부가세 포함 매출)
  const taxAmount = supply * info.rate * 0.1;                // 납부세액

  const purchaseCredit = f.purchasePrice * 0.005;            // 세금계산서등 수취 매입액 × 0.5%
  const cardCredit = Math.min(f.cardSales * 0.013, 10000000);
  const eFilingCredit = f.eFiling ? 10000 : 0;
  const creditTotal = purchaseCredit + cardCredit + eFilingCredit;

  const exempt = supply < SIMPLE_EXEMPT_THRESHOLD;           // 납부의무 면제 (4,800만원 미만)
  // 간이과세자는 공제세액이 납부세액을 넘어도 환급되지 않는다
  const payable = exempt ? 0 : Math.max(0, taxAmount - creditTotal);
  const overEligible = supply >= SIMPLE_ELIGIBLE_THRESHOLD;

  return { info, supply, taxAmount, purchaseCredit, cardCredit, eFilingCredit, creditTotal, exempt, payable, overEligible };
}


// ========================================
// 🎨 Design System Components
// ========================================

function Button({ variant = 'primary', size = 'md', disabled, onClick, className = '', children, ...rest }) {
  const variants = {
    primary: 'bg-indigo-600 text-white hover:bg-indigo-700 active:bg-indigo-800 shadow-sm',
    secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 active:bg-slate-100',
    danger: 'bg-rose-600 text-white hover:bg-rose-700 active:bg-rose-800 shadow-sm',
    ghost: 'bg-transparent text-slate-600 hover:bg-slate-200/70 active:bg-slate-300/70',
  };
  const sizes = {
    sm: 'px-2.5 py-1 text-xs rounded-md',
    md: 'px-4 py-2 text-sm rounded-lg',
    lg: 'px-5 py-2.5 text-base rounded-xl',
  };
  return (
    <button
      type="button"
      onClick={onClick}
      disabled={disabled}
      className={`font-semibold transition-colors disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-1 ${variants[variant]} ${sizes[size]} ${className}`}
      {...rest}
    >
      {children}
    </button>
  );
}

function Card({ title, desc, right, children, className = '' }) {
  return (
    <section className={`bg-white rounded-2xl shadow-sm ring-1 ring-slate-200/70 ${className}`}>
      {(title || right) && (
        <header className="flex items-start justify-between gap-3 px-5 pt-5 pb-3">
          <div>
            {title && <h2 className="text-base font-bold text-slate-900">{title}</h2>}
            {desc && <p className="mt-0.5 text-xs text-slate-500 leading-relaxed">{desc}</p>}
          </div>
          {right}
        </header>
      )}
      <div className={title || right ? 'px-5 pb-5' : 'p-5'}>{children}</div>
    </section>
  );
}

function Badge({ children, color = 'slate', className = '' }) {
  const colors = {
    slate: 'bg-slate-100 text-slate-600 ring-slate-200',
    indigo: 'bg-indigo-50 text-indigo-700 ring-indigo-200',
    emerald: 'bg-emerald-50 text-emerald-700 ring-emerald-200',

 * 입력값 아래에 한글 금액(1,234만원)을 즉시 보여줘 자릿수 실수를 막는다.
 */
function MoneyInput({ label, value, onChange, placeholder = '0', hint, quickAdd, disabled, error }) {
  const handleChange = (e) => {
    const raw = e.target.value.replace(/[^0-9]/g, '');
    onChange(raw === '' ? 0 : Math.min(Number(raw), 999999999999));
  };
  return (
    <div>
      {label && <label className="block text-xs font-semibold text-slate-600 mb-1">{label}</label>}
      <div className="relative">
        <input
          type="text"
          inputMode="numeric"
          value={value === 0 ? '' : value.toLocaleString('ko-KR')}
          onChange={handleChange}
          placeholder={placeholder}
          disabled={disabled}
          aria-label={label}
          className={`w-full pl-3 pr-9 py-2 text-right tnum text-sm font-semibold rounded-lg border bg-white
            focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 disabled:bg-slate-100 disabled:text-slate-400
            ${error ? 'border-rose-400' : 'border-slate-300'}`}
        />
        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none">원</span>
      </div>
      <div className="flex items-start justify-between gap-2 mt-1">
        <p className={`text-[11px] leading-snug ${error ? 'text-rose-600' : 'text-slate-400'}`}>
          {error || (value > 0 ? toKoreanAmount(value) : hint)}
        </p>
        {quickAdd && (
          <div className="flex gap-1 shrink-0">
            {quickAdd.map((amt) => (
              <button
                key={amt}
                type="button"
                onClick={() => onChange(Math.min(value + amt, 999999999999))}
                className="px-1.5 py-0.5 text-[10px] font-semibold rounded bg-slate-100 text-slate-500 hover:bg-slate-200"
              >
                +{amt >= 100000000 ? amt / 100000000 + '억' : amt / 10000 + '만'}
              </button>
            ))}
            <button
              type="button"
              onClick={() => onChange(0)}
              className="px-1.5 py-0.5 text-[10px] font-semibold rounded bg-slate-100 text-slate-500 hover:bg-slate-200"
            >
              초기화
            </button>

      </div>
    </div>
  );
}

function Modal({ isOpen, onClose, title, size = 'md', children }) {
  useEffect(() => {
    if (!isOpen) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [isOpen, onClose]);

  if (!isOpen) return null;
  const sizes = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl' };
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in" role="dialog" aria-modal="true" aria-label={title}>
      <div className="absolute inset-0 bg-slate-900/50" onClick={onClose} />
      <div className={`relative w-full ${sizes[size]} max-h-[88vh] flex flex-col bg-white rounded-t-2xl sm:rounded-2xl shadow-xl animate-slide-up`}>
        <header className="flex items-center justify-between px-5 py-4 border-b border-slate-200">

          <button type="button" onClick={onClose} aria-label="닫기" className="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-600 text-xl leading-none">
            ×
          </button>
        </header>
        <div className="px-5 py-4 overflow-y-auto">{children}</div>
      </div>
    </div>
  );
}

// 🔀 Router (해시 기반)
// ========================================
const RouterContext = createContext({ path: '/', navigate: () => {} });

function Router({ children }) {
  const [path, setPath] = useState(() => window.location.hash.slice(1) || '/');

  useEffect(() => {
    const onHashChange = () => {
      setPath(window.location.hash.slice(1) || '/');
      window.scrollTo(0, 0);
    };
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  const navigate = useCallback((to) => { window.location.hash = to; }, []);
  const value = useMemo(() => ({ path, navigate }), [path, navigate]);
  return <RouterContext.Provider value={value}>{children}</RouterContext.Provider>;
}

const useRouter = () => useContext(RouterContext);

function Routes({ children }) {
  const { path } = useRouter();
  const routes = React.Children.toArray(children);
  const matched = routes.find((r) => r.props.path === path) || routes.find((r) => r.props.path === '*');
  return matched ? matched.props.element : null;
}

function Route() { return null; }

function Link({ to, className = '', activeClassName = '', children, ...rest }) {
  const { path } = useRouter();
  const isActive = path === to;
  return (
    <a href={'#' + to} className={`${className} ${isActive ? activeClassName : ''}`} aria-current={isActive ? 'page' : undefined} {...rest}>
      {children}
    </a>
  );
}

            sub={r.useStandard ? '특별공제 합계가 표준세액공제보다 적어 표준 적용' : '보험료·의료비·교육비·기부금·월세 합계'}
          />
          <ResultRow label="세액공제 합계" value={r.creditTotal} strong tone="sub" />

          <StepTitle step="5">결정세액</StepTitle>
          <ResultRow label="종합소득 결정세액" value={r.determinedTax} tone="tax" sub="산출세액 − 세액공제 (0원 미만이면 0)" />

          {form.prepaid > 0 && <ResultRow label="기납부세액" value={form.prepaid} tone="sub" />}
          <ResultRow
            label={r.finalPayable >= 0 ? '차감 납부할 세액' : '환급받을 세액'}
            value={Math.abs(r.finalPayable)}
            strong
            tone={r.finalPayable >= 0 ? 'tax' : 'sub'}
          />
        </Card>

        {r.financialIncome > 0 && (
          <Callout tone="warn" title="금융소득 종합과세 유의">
            금융소득이 2,000만원을 초과하면 종합과세하되, 산출세액은 <b>비교과세</b>(종합과세 방식과 14% 분리과세 방식 중 큰 금액)로
            결정됩니다. 이 계산기는 종합과세 방식만 반영하므로 실제 세액과 차이가 날 수 있습니다.
          </Callout>

        {incomeType !== 'labor' && r.businessIncome > 0 && (
          <Callout tone="info" title="사업소득자 참고">

            직전연도 수입금액이 업종별 기준을 넘으면 성실신고확인 대상이 되어 신고기한이 6월 30일까지로 연장됩니다.
          </Callout>
        )}
      </div>

      <Modal isOpen={showBrackets} onClose={() => setShowBrackets(false)} title="종합소득세 기본세율 (2023 귀속 이후)">
        <BracketTable />
      </Modal>
    </div>
  );
}

/** 세율표 (모달 · 안내 페이지 공용) */
function BracketTable() {
  return (
    <div className="overflow-x-auto">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-left text-xs text-slate-500 border-b border-slate-200">
            <th className="py-2 pr-3 font-semibold">과세표준</th>
            <th className="py-2 pr-3 font-semibold text-right">세율</th>
            <th className="py-2 font-semibold text-right">누진공제</th>
          </tr>
        </thead>
        <tbody className="divide-y divide-slate-100">
          {TAX_BRACKETS.map((b, i) => {
            const prev = i === 0 ? 0 : TAX_BRACKETS[i - 1].upto;
            return (
              <tr key={i}>
                <td className="py-2 pr-3 text-slate-700 tnum whitespace-nowrap">
                  {i === 0 ? '1,400만원 이하' : (b.upto === Infinity ? '10억원 초과' : `${toKoreanAmount(prev)} 초과 ~ ${toKoreanAmount(b.upto)} 이하`)}
                </td>
                <td className="py-2 pr-3 text-right font-bold text-indigo-700 tnum">{pct(b.rate, 0)}</td>
                <td className="py-2 text-right text-slate-600 tnum">{won0(b.quick)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <p className="mt-3 text-[11px] text-slate-400 leading-relaxed">
        산출세액 = 과세표준 × 세율 − 누진공제. 위 세액의 10%가 지방소득세로 별도 부과됩니다.
      </p>
    </div>
  );
}

const DEFAULT_GENERAL_VAT = {

  const setGeneral = useCallback((key) => (value) => setG((p) => ({ ...p, [key]: value })), []);

          ]}
        />
        <p className="text-[11px] text-slate-400">

/** 부가세 포함/미포함 분리 계산 */
function VatSplitSection() {
  const [amount, setAmount] = useState(0);
  const [included, setIncluded] = useState(true);

  const supply = included ? Math.round(amount / 1.1) : amount;
  const vat = included ? amount - supply : Math.round(amount * 0.1);
  const total = supply + vat;

  return (
    <div className="max-w-2xl mx-auto space-y-4">
      <Card title="부가세 분리 계산" desc="금액이 부가세를 포함한 값인지 아닌지에 따라 공급가액과 세액을 나눠 계산합니다.">
        <Segmented
          value={included ? 'inc' : 'exc'}
          onChange={(v) => setIncluded(v === 'inc')}
          className="w-full mb-4"
          options={[
            { value: 'inc', label: '부가세 포함 금액 (공급대가)' },
            { value: 'exc', label: '부가세 미포함 금액 (공급가액)' },
          ]}
        />
        <MoneyInput
          label="금액"
          value={amount}
          onChange={setAmount}
          hint={included ? '결제한 총액을 입력하세요' : '세금계산서의 공급가액을 입력하세요'}
          quickAdd={[10000, 100000, 1000000]}
        />

        <div className="mt-5 grid grid-cols-3 gap-2 text-center">
          <div className="rounded-xl bg-slate-50 p-3">
            <p className="text-[11px] font-semibold text-slate-400">공급가액</p>
            <p className="mt-1 text-base font-extrabold text-slate-800 tnum">{won0(supply)}</p>
          </div>
          <div className="rounded-xl bg-indigo-50 p-3">
            <p className="text-[11px] font-semibold text-indigo-500">부가세</p>
            <p className="mt-1 text-base font-extrabold text-indigo-700 tnum">{won0(vat)}</p>
          </div>
          <div className="rounded-xl bg-slate-800 p-3">
            <p className="text-[11px] font-semibold text-slate-300">합계</p>
            <p className="mt-1 text-base font-extrabold text-white tnum">{won0(total)}</p>
          </div>
        </div>

        <p className="mt-4 text-[11px] text-slate-400 leading-relaxed">
          부가세 포함 금액에서 공급가액을 구할 때는 <b>÷ 1.1</b>, 세액은 <b>× 10/110</b>입니다.
          원 단위 절사 방식에 따라 1원 차이가 날 수 있습니다.
        </p>
      </Card>
    </div>
  );
}

const PAGE_META = {
  '/income': { title: '종합소득세 계산기', desc: '근로·사업·기타 소득을 합산해 결정세액과 지방소득세까지 계산합니다.' },

};

function PageHeading() {
  const { path } = useRouter();
  const meta = PAGE_META[path];
  if (!meta) return null;
  return (
    <div className="mb-5">
      <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">{meta.title}</h1>
      <p className="mt-1 text-[13px] text-slate-500">{meta.desc}</p>
    </div>
  );
}

function App() {
  return (
    <Router>
      <div className="min-h-screen flex flex-col">
        <Header />
        <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
          <PageHeading />
          <Routes>
            <Route path="/" element={<HomePage />} />
            <Route path="/income" element={<IncomeTaxPage />} />
            <Route path="/vat" element={<VatPage />} />
            <Route path="/guide" element={<GuidePage />} />
            <Route path="*" element={<NotFoundPage />} />
          </Routes>
        </main>
        <Footer />
      </div>
    </Router>
  );
}
