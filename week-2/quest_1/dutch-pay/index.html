<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>더치페이 계산기</title>

  <!-- ⚠️ 모든 CDN 버전 고정 (Babel 은 반드시 7.x) -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* number input 스피너 제거 (Tailwind 유틸리티로는 불가) */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .animate-slide-up { animation: slideUp .22s ease-out both; }

    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;

    // ========================================
    // 🔧 Utils & Constants
    // ========================================

    let _uid = 0;
    const nextId = () => 'k' + (++_uid);

    /** 입력값(문자열)을 0 이상의 숫자로 정규화 */
    const toNum = (v) => {
      const n = Number(v);
      if (!Number.isFinite(n) || n < 0) return 0;   // 조건 분기: 비정상 입력 방어
      return n;
    };

    const won = (n) => Math.round(n).toLocaleString('ko-KR') + '원';
    const pct = (r) => (r * 100).toFixed(1) + '%';
    const clamp = (n, min, max) => Math.min(Math.max(n, min), max);

    // 배열: 1인 청구액 올림 단위 옵션
    const ROUND_UNITS = [
      { value: 1,    label: '1원 단위' },
      { value: 10,   label: '10원 단위' },
      { value: 100,  label: '100원 단위' },
      { value: 1000, label: '1,000원 단위' },
    ];

    // 배열: 할인 방식 옵션
    const DISCOUNT_TYPES = [
      { value: 'none',    label: '할인 없음' },
      { value: 'percent', label: '퍼센트 (%)' },
      { value: 'amount',  label: '금액 (원)' },
    ];

    const QUICK_PERCENTS = [5, 10, 15, 20];

    // 참여자 칩 색상 (배열 + 인덱스 순환)
    const CHIP_COLORS = [
      'bg-indigo-600', 'bg-emerald-600', 'bg-amber-500',
      'bg-rose-500', 'bg-sky-600', 'bg-violet-600',
    ];
    const colorOf = (index) => CHIP_COLORS[index % CHIP_COLORS.length];

    const createPerson = (name) => ({ id: nextId(), name });
    const createMenu = (name = '', price = '', qty = 1, sharedBy = []) =>
      ({ id: nextId(), name, price, qty, sharedBy });

    // 초기 예시 데이터: 공용 메뉴 + 일부만 먹은 메뉴를 섞어서 보여준다
    const INITIAL_PEOPLE = [createPerson('건우'), createPerson('지민'), createPerson('수현')];
    const ALL_IDS = INITIAL_PEOPLE.map((p) => p.id);
    const INITIAL_MENUS = [
      createMenu('삼겹살 4인분', 60000, 1, [...ALL_IDS]),
      createMenu('된장찌개', 9000, 1, [...ALL_IDS]),
      createMenu('소주', 5000, 2, [ALL_IDS[0], ALL_IDS[1]]),
      createMenu('콜라', 2000, 1, [ALL_IDS[2]]),
    ];

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', className = '', ...props }) {
      const base = 'inline-flex items-center justify-center gap-1.5 font-semibold rounded-xl transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-40 disabled:cursor-not-allowed active:scale-[0.97]';
      const variants = {
        primary:   'bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-400 shadow-sm shadow-indigo-200',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-slate-300',
        danger:    'bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 focus:ring-rose-300',
        ghost:     'text-slate-400 hover:text-rose-600 hover:bg-rose-50 focus:ring-rose-200',
      };
      const sizes = {
        sm: 'text-xs px-2.5 py-1.5',
        md: 'text-sm px-4 py-2.5',
        lg: 'text-base px-5 py-3',
      };
      return <button type="button" className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props} />;
    }

    function Input({ label, error, suffix, className = '', id, ...props }) {
      const inputId = id || nextId();
      return (
        <div className={className}>
          {label && (
            <label htmlFor={inputId} className="block text-xs font-semibold text-slate-500 mb-1">{label}</label>
          )}
          <div className="relative">
            <input
              id={inputId}
              className={`w-full rounded-xl border bg-white px-3 py-2.5 text-sm text-slate-900 placeholder-slate-300 transition focus:outline-none focus:ring-2 focus:border-transparent ${suffix ? 'pr-9' : ''} ${error ? 'border-rose-300 focus:ring-rose-300' : 'border-slate-200 focus:ring-indigo-400'}`}
              {...props}
            />
            {suffix && (
              <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-400">{suffix}</span>
            )}
          </div>
          {error && <p className="mt-1 text-xs text-rose-500">{error}</p>}
        </div>
      );
    }

    function Select({ label, className = '', id, options = [], ...props }) {
      const selectId = id || nextId();
      return (
        <div className={className}>
          {label && <label htmlFor={selectId} className="block text-xs font-semibold text-slate-500 mb-1">{label}</label>}
          <select
            id={selectId}
            className="w-full appearance-none rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-medium text-slate-700 transition focus:outline-none focus:ring-2 focus:ring-indigo-400"
            {...props}
          >
            {/* 반복문(map): 옵션 배열 렌더링 */}
            {options.map((opt) => (
              <option key={opt.value} value={opt.value}>{opt.label}</option>
            ))}
          </select>
        </div>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`rounded-2xl border border-slate-200 bg-white shadow-sm ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'slate', className = '', children }) {
      const tones = {
        slate:   'bg-slate-100 text-slate-600',
        indigo:  'bg-indigo-50 text-indigo-700',
        amber:   'bg-amber-50 text-amber-700',
        emerald: 'bg-emerald-50 text-emerald-700',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-semibold ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // 🧩 Common / Layout Components
    // ========================================

    function Header({ peopleCount, menuCount }) {
      return (
        <header className="bg-gradient-to-r from-indigo-600 to-violet-600">
          <div className="mx-auto max-w-6xl px-4 py-7 sm:px-6 sm:py-9">
            <div className="flex flex-wrap items-end justify-between gap-4">
              <div>
                <h1 className="text-2xl font-bold text-white sm:text-3xl">🧾 더치페이 계산기</h1>
                <p className="mt-1.5 text-sm text-indigo-100">
                  메뉴마다 <b className="font-bold text-white">먹은 사람</b>을 고르면 그 인원끼리 1/N 으로 나눠서 계산해요.
                </p>
              </div>
              <div className="flex gap-2">
                <div className="rounded-xl bg-white/15 px-4 py-2 text-white backdrop-blur">
                  <span className="text-xs text-indigo-100">인원수</span>
                  <p className="text-xl font-bold leading-tight">{peopleCount}명</p>
                </div>
                <div className="rounded-xl bg-white/15 px-4 py-2 text-white backdrop-blur">
                  <span className="text-xs text-indigo-100">메뉴</span>
                  <p className="text-xl font-bold leading-tight">{menuCount}개</p>
                </div>
              </div>
            </div>
          </div>
        </header>
      );
    }

    function StatRow({ label, value, tone = 'default' }) {
      const tones = {
        default: 'text-slate-800 text-sm',
        minus:   'text-rose-600 text-sm',
        strong:  'text-indigo-700 text-lg',
      };
      return (
        <div className="flex items-baseline justify-between gap-3 py-1.5">
          <span className="text-sm text-slate-500">{label}</span>
          <span className={`font-extrabold tabular-nums ${tones[tone]}`}>{value}</span>
        </div>
      );
    }

    function EmptyState({ title, description, action }) {
      return (
        <div className="flex flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-200 bg-white/60 px-6 py-14 text-center">
          <div className="mb-3 text-4xl">🍽️</div>
          <p className="font-semibold text-slate-700">{title}</p>
          <p className="mt-1 max-w-xs text-sm text-slate-400">{description}</p>
          {action && <div className="mt-5">{action}</div>}
        </div>
      );
    }

    // ========================================
    // 📄 Page Components — 참여자 관리
    // ========================================

    function PeoplePanel({ people, headcountInput, setHeadcountInput, onApplyHeadcount, onAddPerson, onRenamePerson, onRemovePerson }) {
      return (
        <Card className="p-4">
          <h2 className="mb-3 text-sm font-bold text-slate-800">👥 참여자</h2>

          <div className="mb-3 flex flex-wrap items-end gap-2">
            <div className="w-32">
              <Input
                label="인원수 한 번에 설정"
                type="number"
                min="0"
                max="30"
                value={headcountInput}
                onChange={(e) => setHeadcountInput(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') onApplyHeadcount(); }}
                suffix="명"
                className="[&_input]:tabular-nums"
              />
            </div>
            <Button variant="secondary" onClick={onApplyHeadcount}>적용</Button>
            <Button onClick={onAddPerson}>+ 참여자 추가</Button>
          </div>

          {/* 조건 분기: 참여자가 없으면 안내 문구 */}
          {people.length === 0 ? (
            <p className="rounded-xl bg-slate-50 px-3 py-4 text-center text-sm text-slate-400">
              참여자를 먼저 추가해 주세요.
            </p>
          ) : (
            <div className="flex flex-wrap gap-2">
              {/* 반복문(map): 참여자 배열을 칩으로 렌더링 */}
              {people.map((person, index) => (
                <div key={person.id} className="flex items-center gap-1 rounded-full bg-slate-100 py-1 pl-1 pr-1.5">
                  <span className={`flex h-6 w-6 items-center justify-center rounded-full text-[11px] font-bold text-white ${colorOf(index)}`}>
                    {index + 1}
                  </span>
                  <input
                    type="text"
                    value={person.name}
                    onChange={(e) => onRenamePerson(person.id, e.target.value)}
                    placeholder={`참여자 ${index + 1}`}
                    aria-label="참여자 이름"
                    size={Math.max(4, person.name.length + 1)}
                    className="min-w-0 rounded-md bg-transparent px-1 py-0.5 text-sm font-semibold text-slate-700 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400"
                  />
                  <button
                    type="button"
                    onClick={() => onRemovePerson(person.id)}
                    aria-label={`${person.name || '참여자'} 삭제`}
                    className="flex h-5 w-5 items-center justify-center rounded-full text-xs text-slate-400 hover:bg-rose-100 hover:text-rose-600"
                  >✕</button>
                </div>
              ))}
            </div>
          )}
        </Card>
      );
    }

    // ========================================
    // 📄 Page Components — 메뉴 & 먹은 사람 선택
    // ========================================

    function MenuCard({ menu, index, people, split, onUpdate, onRemove }) {
      const price = toNum(menu.price);
      const qty = toNum(menu.qty);
      const lineTotal = price * qty;

      const memberSet = new Set(menu.sharedBy);
      const allSelected = people.length > 0 && people.every((p) => memberSet.has(p.id));

      // 배열 조작: 먹은 사람 토글
      const toggleMember = (personId) => {
        const next = memberSet.has(personId)
          ? menu.sharedBy.filter((id) => id !== personId)   // 조건 분기: 이미 있으면 제거
          : [...menu.sharedBy, personId];                   //            없으면 추가
        onUpdate({ ...menu, sharedBy: next });
      };

      const toggleAll = () =>
        onUpdate({ ...menu, sharedBy: allSelected ? [] : people.map((p) => p.id) });

      return (
        <Card className="animate-slide-up p-3 sm:p-4">
          <div className="flex flex-wrap items-center gap-2 sm:flex-nowrap">
            <span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-xs font-bold text-slate-500">
              {index + 1}
            </span>

            <input
              type="text"
              value={menu.name}
              onChange={(e) => onUpdate({ ...menu, name: e.target.value })}
              placeholder="메뉴 이름"
              aria-label="메뉴 이름"
              className="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            />

            <div className="relative w-28 shrink-0">
              <input
                type="number"
                min="0"
                step="500"
                value={menu.price}
                onChange={(e) => onUpdate({ ...menu, price: e.target.value })}
                placeholder="0"
                aria-label="가격"
                className="w-full rounded-lg border border-slate-200 bg-white py-2 pl-3 pr-7 text-right text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
              <span className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-400">원</span>
            </div>

            <div className="flex shrink-0 items-center rounded-lg border border-slate-200 bg-white">
              <button
                type="button"
                onClick={() => onUpdate({ ...menu, qty: Math.max(1, qty - 1) })}
                aria-label="수량 줄이기"
                className="px-2.5 py-2 text-slate-400 hover:text-indigo-600"
              >−</button>
              <span className="w-7 text-center text-sm font-semibold tabular-nums">{qty}</span>
              <button
                type="button"
                onClick={() => onUpdate({ ...menu, qty: qty + 1 })}
                aria-label="수량 늘리기"
                className="px-2.5 py-2 text-slate-400 hover:text-indigo-600"
              >+</button>
            </div>

            <Button variant="ghost" size="sm" onClick={onRemove} aria-label="메뉴 삭제" className="shrink-0">✕</Button>
          </div>

          {/* 먹은 사람 선택 */}
          <div className="mt-3 flex flex-wrap items-center gap-1.5 border-t border-slate-100 pt-3">
            <span className="mr-1 text-xs font-semibold text-slate-500">먹은 사람</span>

            {/* 조건 분기: 참여자가 없으면 선택 UI 대신 안내 */}
            {people.length === 0 ? (
              <span className="text-xs text-slate-400">참여자를 먼저 추가해 주세요.</span>
            ) : (
              <React.Fragment>
                <button
                  type="button"
                  onClick={toggleAll}
                  aria-pressed={allSelected}
                  className={`rounded-full border px-2.5 py-1 text-xs font-bold transition ${allSelected ? 'border-slate-800 bg-slate-800 text-white' : 'border-slate-300 text-slate-500 hover:border-slate-400'}`}
                >
                  {allSelected ? '전체 해제' : '전체'}
                </button>

                {/* 반복문(map): 참여자별 토글 칩 */}
                {people.map((person, i) => {
                  const on = memberSet.has(person.id);   // 조건 분기: 선택 여부로 스타일 변경
                  return (
                    <button
                      key={person.id}
                      type="button"
                      onClick={() => toggleMember(person.id)}
                      aria-pressed={on}
                      className={`rounded-full px-2.5 py-1 text-xs font-semibold transition ${on ? colorOf(i) + ' text-white shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}`}
                    >
                      {person.name.trim() || `참여자 ${i + 1}`}
                    </button>
                  );
                })}
              </React.Fragment>
            )}
          </div>

          {/* 조건 분기: 상태에 따라 다른 요약 문구 */}
          <div className="mt-2 flex flex-wrap items-center justify-between gap-2 text-xs">
            {lineTotal <= 0 ? (
              <span className="text-slate-400">가격을 입력하면 나눠서 계산해요.</span>
            ) : split.members.length === 0 ? (
              <Badge tone="amber">먹은 사람을 선택해야 계산에 포함돼요</Badge>
            ) : (
              <span className="text-slate-500">
                <b className="font-bold text-slate-700">{won(lineTotal)}</b>
                {' 를 '}
                <b className="font-bold text-slate-700">{split.members.length}명</b>
                {' 이 나눠서 '}
                <b className="font-bold text-indigo-700">1인당 약 {won(split.perHead)}</b>
                {/* 조건 분기: 나눠떨어지지 않으면 안내 */}
                {split.remainder > 0 && <span className="text-slate-400">{` (${split.remainder}원은 앞사람부터 1원씩)`}</span>}
              </span>
            )}
          </div>
        </Card>
      );
    }

    // ========================================
    // 📄 Page Components — 할인 & 결과
    // ========================================

    function DiscountPanel({ discountType, setDiscountType, discountValue, setDiscountValue, unit, setUnit, notice }) {
      return (
        <Card className="p-4">
          <h2 className="mb-3 text-sm font-bold text-slate-800">💸 할인 적용</h2>

          {/* 배열 + 반복문으로 세그먼트 버튼 생성 */}
          <div className="mb-3 grid grid-cols-3 gap-1 rounded-xl bg-slate-100 p-1">
            {DISCOUNT_TYPES.map((t) => (
              <button
                key={t.value}
                type="button"
                onClick={() => setDiscountType(t.value)}
                aria-pressed={discountType === t.value}
                className={`rounded-lg px-2 py-2 text-xs font-semibold transition ${discountType === t.value ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
              >
                {t.label}
              </button>
            ))}
          </div>

          {/* 조건 분기: 할인 방식에 따라 다른 입력 UI */}
          {discountType === 'none' ? (
            <p className="rounded-xl bg-slate-50 px-3 py-3 text-xs text-slate-400">
              할인 없이 나눈 금액 그대로 계산합니다.
            </p>
          ) : (
            <div className="space-y-2">
              <Input
                type="number"
                min="0"
                step={discountType === 'percent' ? '1' : '500'}
                value={discountValue}
                onChange={(e) => setDiscountValue(e.target.value)}
                placeholder="0"
                suffix={discountType === 'percent' ? '%' : '원'}
                aria-label="할인 값"
                className="[&_input]:text-right [&_input]:tabular-nums"
              />
              {/* 조건 분기: 퍼센트 모드일 때만 빠른 선택 칩 노출 */}
              {discountType === 'percent' && (
                <div className="flex flex-wrap gap-1.5">
                  {QUICK_PERCENTS.map((p) => (
                    <button
                      key={p}
                      type="button"
                      onClick={() => setDiscountValue(String(p))}
                      className="rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-600 hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-700"
                    >{p}%</button>
                  ))}
                </div>
              )}
              <p className="text-[11px] leading-relaxed text-slate-400">
                할인은 각자 나눠 가진 금액의 비율대로 배분돼요.
              </p>
            </div>
          )}

          <div className="mt-4 border-t border-slate-100 pt-3">
            <Select
              label="1인 청구액 올림 단위"
              value={unit}
              onChange={(e) => setUnit(Number(e.target.value))}
              options={ROUND_UNITS}
            />
          </div>

          {/* 조건 분기: 경고가 있을 때만 노출 */}
          {notice && (
            <p className="mt-3 rounded-xl bg-amber-50 px-3 py-2 text-xs font-medium text-amber-700">⚠️ {notice}</p>
          )}
        </Card>
      );
    }

    function ResultPanel({ result, unit }) {
      const { total, discount, payable, rows, collected, surplus } = result;

      return (
        <Card className="p-4">
          <h2 className="mb-2 text-sm font-bold text-slate-800">🧮 정산 결과</h2>

          <div className="divide-y divide-slate-100">
            <div className="pb-1">
              <StatRow label="총 주문 금액" value={won(total)} />
              {/* 조건 분기: 할인이 있을 때만 할인 줄 표시 */}
              {discount > 0 && <StatRow label="할인" value={'- ' + won(discount)} tone="minus" />}
              <StatRow label="실제 결제 금액" value={won(payable)} tone="strong" />
            </div>

            <div className="py-2">
              {/* 조건 분기: 계산할 금액이 없으면 안내 문구 */}
              {total === 0 ? (
                <p className="py-6 text-center text-sm text-slate-400">
                  메뉴 가격과 먹은 사람을 정하면<br />1인당 금액이 계산돼요.
                </p>
              ) : (
                <ul className="space-y-2.5 py-1">
                  {/* 반복문(map): 1인별 계산 결과 렌더링 */}
                  {rows.map((row, i) => (
                    <li key={row.id} className="rounded-xl bg-slate-50 p-3">
                      <div className="flex items-center justify-between gap-2">
                        <div className="flex min-w-0 items-center gap-2">
                          <span className={`h-2.5 w-2.5 shrink-0 rounded-full ${colorOf(i)}`} />
                          <span className="truncate font-bold text-slate-800">{row.name}</span>
                          {/* 조건 분기: 먹은 메뉴가 없는 사람은 별도 배지 */}
                          {row.subtotal === 0
                            ? <Badge tone="amber">먹은 메뉴 없음</Badge>
                            : <Badge tone="slate">{pct(row.ratio)}</Badge>}
                        </div>
                        <span className="shrink-0 text-lg font-extrabold tabular-nums text-indigo-700">{won(row.charge)}</span>
                      </div>

                      <div className="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-slate-200">
                        <div className={`h-full rounded-full transition-all duration-300 ${colorOf(i)}`} style={{ width: pct(row.ratio) }} />
                      </div>

                      {/* 조건 분기: 먹은 메뉴가 있을 때만 상세 내역 제공 */}
                      {row.details.length > 0 && (
                        <details className="mt-2">
                          <summary className="text-[11px] font-semibold text-slate-400 hover:text-indigo-600">
                            먹은 내역 {row.details.length}건 · 합계 {won(row.subtotal)}
                          </summary>
                          <ul className="mt-1.5 space-y-1 border-l-2 border-slate-200 pl-2.5">
                            {/* 반복문(map): 개인별 메뉴 분담 내역 */}
                            {row.details.map((d, j) => (
                              <li key={j} className="flex justify-between gap-2 text-[11px] text-slate-500">
                                <span className="truncate">
                                  {d.name}
                                  <span className="text-slate-400">{` (${d.memberCount}명)`}</span>
                                </span>
                                <span className="shrink-0 tabular-nums">{won(d.share)}</span>
                              </li>
                            ))}
                          </ul>
                        </details>
                      )}
                    </li>
                  ))}
                </ul>
              )}
            </div>

            {/* 조건 분기: 계산할 금액이 있을 때만 합계 영역 노출 */}
            {total > 0 && (
              <div className="pt-2">
                <StatRow label="걷는 금액 합계" value={won(collected)} />
                {surplus > 0 && (
                  <p className="mt-1 rounded-xl bg-emerald-50 px-3 py-2 text-xs font-medium text-emerald-700">
                    {unit.toLocaleString('ko-KR')}원 단위 올림으로 {won(surplus)}이 남아요. 팁으로 두거나 다음에 쓰세요 ☕
                  </p>
                )}
              </div>
            )}
          </div>
        </Card>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const [people, setPeople] = useState(INITIAL_PEOPLE);
      const [menus, setMenus] = useState(INITIAL_MENUS);
      const [headcountInput, setHeadcountInput] = useState(String(INITIAL_PEOPLE.length));
      const [discountType, setDiscountType] = useState('percent');
      const [discountValue, setDiscountValue] = useState('10');
      const [unit, setUnit] = useState(100);

      // ---------- 참여자 관리 (배열 조작) ----------
      const addPerson = () => {
        const next = [...people, createPerson(`참여자 ${people.length + 1}`)];
        setPeople(next);
        setHeadcountInput(String(next.length));
      };

      const renamePerson = useCallback((id, name) => {
        setPeople((prev) => prev.map((p) => (p.id === id ? { ...p, name } : p)));
      }, []);

      /** 참여자를 지우면 모든 메뉴의 '먹은 사람' 목록에서도 함께 빼야 한다 */
      const removePerson = (id) => {
        const next = people.filter((p) => p.id !== id);
        setPeople(next);
        setHeadcountInput(String(next.length));
        setMenus((prev) => prev.map((m) => ({ ...m, sharedBy: m.sharedBy.filter((pid) => pid !== id) })));
      };

      /** 입력한 인원수에 맞춰 참여자를 한 번에 늘리거나 줄인다 (반복문 + 조건 분기) */
      const applyHeadcount = () => {
        const target = clamp(Math.floor(toNum(headcountInput)), 0, 30);
        setHeadcountInput(String(target));

        const next = [...people];
        if (target > next.length) {
          // 반복문: 부족한 인원만큼 추가
          for (let i = next.length; i < target; i++) {
            next.push(createPerson(`참여자 ${i + 1}`));
          }
        } else if (target < next.length) {
          // 반복문: 초과 인원은 뒤에서부터 제거하고, 메뉴의 '먹은 사람' 목록도 정리
          const removed = [];
          while (next.length > target) removed.push(next.pop().id);
          setMenus((prev) => prev.map((m) => ({
            ...m,
            sharedBy: m.sharedBy.filter((pid) => !removed.includes(pid)),
          })));
        }
        setPeople(next);
      };

      // ---------- 메뉴 관리 (배열 조작) ----------
      const addMenu = useCallback(() => {
        // 새 메뉴는 기본적으로 전원이 함께 먹는 것으로 시작 (더치페이의 기본값)
        setMenus((prev) => [...prev, createMenu('', '', 1, people.map((p) => p.id))]);
      }, [people]);

      const updateMenu = useCallback((updated) => {
        setMenus((prev) => prev.map((m) => (m.id === updated.id ? updated : m)));
      }, []);

      const removeMenu = useCallback((id) => {
        setMenus((prev) => prev.filter((m) => m.id !== id));
      }, []);

      const resetAll = () => {
        if (!window.confirm('입력한 내용을 모두 지우고 처음부터 시작할까요?')) return;
        const fresh = [createPerson('참여자 1'), createPerson('참여자 2')];
        setPeople(fresh);
        setMenus([createMenu('', '', 1, fresh.map((p) => p.id))]);
        setHeadcountInput(String(fresh.length));
        setDiscountType('none');
        setDiscountValue('');
      };

      // ---------- 💡 핵심 계산 로직 ----------
      const result = useMemo(() => {
        // 참여자 id -> 배열 인덱스 (유효한 사람인지 확인용)
        const indexOfPerson = {};
        for (let i = 0; i < people.length; i++) indexOfPerson[people[i].id] = i;

        // 각자 부담한 금액 / 상세 내역을 담을 배열 초기화
        const subtotals = [];
        const details = [];
        for (let i = 0; i < people.length; i++) {
          subtotals.push(0);
          details.push([]);
        }

        // 1) 메뉴별 1/N 분배 — 2중 반복문
        const splits = {};   // 메뉴 id -> 화면에 보여줄 분배 요약
        for (let i = 0; i < menus.length; i++) {
          const menu = menus[i];
          const lineTotal = toNum(menu.price) * toNum(menu.qty);

          // 이미 삭제된 참여자는 걸러낸다
          const members = menu.sharedBy.filter((pid) => indexOfPerson[pid] !== undefined);

          // 조건 분기: 금액이 없거나 먹은 사람이 없으면 계산에서 제외
          if (lineTotal <= 0 || members.length === 0) {
            splits[menu.id] = { members, perHead: 0, remainder: 0 };
            continue;
          }

          const base = Math.floor(lineTotal / members.length);   // 1인당 기본 몫
          let remainder = lineTotal - base * members.length;     // 나눠떨어지지 않는 나머지(원)
          splits[menu.id] = { members, perHead: lineTotal / members.length, remainder };

          // 반복문: 먹은 사람들에게 금액 분배
          for (let j = 0; j < members.length; j++) {
            let share = base;
            if (remainder > 0) {          // 조건 분기: 나머지는 앞사람부터 1원씩 더 부담
              share += 1;
              remainder -= 1;
            }
            const idx = indexOfPerson[members[j]];
            subtotals[idx] += share;
            details[idx].push({
              name: menu.name.trim() || `메뉴 ${i + 1}`,
              memberCount: members.length,
              share,
            });
          }
        }

        // 2) 총 주문 금액 — 배열 합계
        let total = 0;
        for (let i = 0; i < subtotals.length; i++) total += subtotals[i];

        // 3) 할인 계산 — 조건 분기로 방식 나누기
        let discount = 0;
        let notice = '';
        const value = toNum(discountValue);

        if (discountType === 'percent') {
          const rate = clamp(value, 0, 100);
          if (value > 100) notice = '할인율은 100%까지만 적용돼요.';
          discount = Math.floor((total * rate) / 100);
        } else if (discountType === 'amount') {
          discount = value;
          if (discount > total) {                      // 조건 분기: 총액보다 큰 할인 방어
            discount = total;
            if (total > 0) notice = '할인 금액이 총액보다 커서 총액만큼만 적용했어요.';
          }
        }
        const payable = total - discount;

        // 4) 각자 부담 비율대로 할인 배분 + 올림 단위 적용 — 반복문
        const rows = [];
        let collected = 0;
        for (let i = 0; i < people.length; i++) {
          const subtotal = subtotals[i];
          const ratio = total > 0 ? subtotal / total : 0;   // 조건 분기: 0원일 때 나눗셈 방지
          const fair = payable * ratio;                     // 할인이 반영된 정확한 몫

          let charge = 0;
          if (subtotal > 0) {                               // 조건 분기: 안 먹은 사람은 0원
            charge = Math.ceil(fair / unit) * unit;         // 지정한 단위로 올림
          }
          collected += charge;

          rows.push({
            id: people[i].id,
            name: people[i].name.trim() || `참여자 ${i + 1}`,   // 조건 분기: 이름이 비면 기본값
            subtotal,
            ratio,
            fair,
            charge,
            details: details[i],
          });
        }

        return { splits, total, discount, payable, rows, collected, surplus: collected - payable, notice };
      }, [people, menus, discountType, discountValue, unit]);

      return (
        <div className="min-h-screen pb-16">
          <Header peopleCount={people.length} menuCount={menus.length} />

          <main className="mx-auto max-w-6xl px-4 py-6 sm:px-6">
            <div className="grid gap-6 lg:grid-cols-[1fr_360px]">

              {/* ── 왼쪽: 참여자 & 메뉴 입력 ── */}
              <section className="space-y-4">
                <PeoplePanel
                  people={people}
                  headcountInput={headcountInput}
                  setHeadcountInput={setHeadcountInput}
                  onApplyHeadcount={applyHeadcount}
                  onAddPerson={addPerson}
                  onRenamePerson={renamePerson}
                  onRemovePerson={removePerson}
                />

                <div className="flex items-center justify-between gap-2 pt-1">
                  <h2 className="text-sm font-bold text-slate-800">🍽️ 메뉴</h2>
                  <div className="flex gap-2">
                    <Button size="sm" onClick={addMenu}>+ 메뉴 추가</Button>
                    <Button variant="danger" size="sm" onClick={resetAll}>초기화</Button>
                  </div>
                </div>

                {/* 조건 분기: 메뉴가 없으면 빈 상태 화면 */}
                {menus.length === 0 ? (
                  <EmptyState
                    title="아직 메뉴가 없어요"
                    description="주문한 메뉴를 추가하고, 그 메뉴를 먹은 사람을 골라 주세요."
                    action={<Button onClick={addMenu}>+ 메뉴 추가</Button>}
                  />
                ) : (
                  /* 반복문(map): 메뉴 배열 렌더링 */
                  menus.map((menu, index) => (
                    <MenuCard
                      key={menu.id}
                      menu={menu}
                      index={index}
                      people={people}
                      split={result.splits[menu.id] || { members: [], perHead: 0, remainder: 0 }}
                      onUpdate={updateMenu}
                      onRemove={() => removeMenu(menu.id)}
                    />
                  ))
                )}
              </section>

              {/* ── 오른쪽: 할인 & 결과 ── */}
              <aside className="space-y-4 lg:sticky lg:top-6 lg:self-start">
                <DiscountPanel
                  discountType={discountType}
                  setDiscountType={setDiscountType}
                  discountValue={discountValue}
                  setDiscountValue={setDiscountValue}
                  unit={unit}
                  setUnit={setUnit}
                  notice={result.notice}
                />
                <ResultPanel result={result} unit={unit} />
              </aside>
            </div>

            <footer className="mt-10 rounded-2xl border border-slate-200 bg-white/70 p-4 text-xs leading-relaxed text-slate-500">
              <p className="mb-1 font-bold text-slate-600">🧠 이 앱에 쓰인 개념</p>
              <p><span className="font-semibold text-slate-600">배열</span> — 참여자 목록, 메뉴 목록, 메뉴별 "먹은 사람" 목록을 배열로 관리합니다.</p>
              <p><span className="font-semibold text-slate-600">반복문</span> — 메뉴 배열을 돌며 먹은 사람들에게 금액을 1/N 로 나눠 담고, <code className="rounded bg-slate-100 px-1">map</code> 으로 목록을 그립니다.</p>
              <p><span className="font-semibold text-slate-600">조건 분기</span> — 먹은 사람이 없는 메뉴 제외, 1원 나머지 분배, 할인 방식(없음·%·원) 선택, 총액 초과 할인 방어에 사용합니다.</p>
            </footer>
          </main>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
