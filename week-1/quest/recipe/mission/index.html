<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿡포털 - 봉골레 파스타</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN은 버전을 명시적으로 고정한다. Babel 은 반드시 7.x 로 고정 (8.x 미지원). -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .animate-toast { animation: toast-in 0.2s ease-out; }
  </style>
</head>
<body class="bg-white">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-[#03C75A] text-white hover:bg-[#02b350] focus:ring-[#03C75A]',
        secondary: 'bg-white text-[#03C75A] border border-[#03C75A] hover:bg-green-50 focus:ring-[#03C75A]',
        danger: 'bg-red-500 text-white hover:bg-red-600 focus:ring-red-400',
        ghost: 'bg-transparent text-stone-500 hover:bg-stone-100 focus:ring-stone-300',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-xs gap-1',
        md: 'px-4 py-2 text-sm gap-1.5',
        lg: 'px-6 py-3 text-base gap-2',
      };
      return (
        <button
          type="button"
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Badge({ variant = 'default', className = '', children }) {
      const variants = {
        default: 'bg-stone-100 text-stone-600',
        green: 'bg-green-50 text-[#03C75A]',
        info: 'bg-blue-50 text-blue-600',
      };
      return (
        <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold ${variants[variant]} ${className}`}>
          {children}
        </span>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white rounded-xl border border-stone-200 p-5 sm:p-6 ${className}`}>
          {children}
        </div>
      );
    }

    function CheckItem({ checked, onToggle, children }) {
      return (
        <li>
          <label className="flex items-start gap-2.5 py-1.5 cursor-pointer select-none group">
            <input
              type="checkbox"
              checked={checked}
              onChange={onToggle}
              className="mt-0.5 h-4 w-4 shrink-0 rounded border-stone-300 text-[#03C75A] focus:ring-[#03C75A] cursor-pointer"
            />
            <span className={`text-sm text-stone-700 group-hover:text-stone-900 ${checked ? 'line-through opacity-50' : ''}`}>
              {children}
            </span>
          </label>
        </li>
      );
    }

    // 📦 Recipe Data

    const SEARCH_INDEX = [
      ...INGREDIENTS.map((text) => ({ text, tag: '재료', target: 'ingredients-section' })),
      ...STEPS.map((s) => ({ text: `${s.title} — ${s.desc}`, tag: '조리순서', target: 'steps-section' })),
      ...TIPS.map((text) => ({ text, tag: '꿀팁', target: 'tips-section' })),
    ];

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================

    function UtilityBar({ onPrint }) {
      return (
        <div className="border-b border-stone-100">
          <div className="max-w-5xl mx-auto px-4 sm:px-6 h-8 flex items-center justify-end gap-3 text-[11px] text-stone-400">
            <button type="button" onClick={onPrint} className="hover:text-stone-600">레시피 인쇄</button>
            <span className="text-stone-200">|</span>
            <span>로그인 없이 이용 중</span>
          </div>
        </div>
      );
    }

    function Footer() {
      return (
        <footer className="mt-14 border-t border-stone-100 bg-stone-50">
          <div className="max-w-5xl mx-auto px-4 sm:px-6 py-6 text-center text-xs text-stone-400">
            쿡포털 · 20분이면 완성되는 메뉴예요. 맛있게 드세요! 🍝
          </div>
        </footer>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================

    function QuickMenu({ items }) {
      return (
        <div className="flex flex-wrap justify-center gap-x-6 gap-y-4 max-w-2xl mx-auto">
          {items.map((item) => (
            <button
              key={item.label}
              type="button"
              onClick={item.onClick}
              className="flex flex-col items-center gap-1.5 w-16 group"
            >
              <span className="w-12 h-12 rounded-full bg-green-50 text-[#03C75A] flex items-center justify-center text-xl group-hover:bg-[#03C75A] group-hover:text-white transition-colors">
                {item.icon}
              </span>
              <span className="text-[11px] text-stone-500 group-hover:text-stone-800">{item.label}</span>
            </button>
          ))}
        </div>
      );
    }

    function SearchHero({ query, setQuery, results, onResultClick, favorited, onToggleFavorite, onPrint, onShare }) {
      const inputRef = useRef(null);

      return (
        <section className="bg-gradient-to-b from-green-50/60 to-white pb-6">
          <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-10 sm:pt-14">
            <div className="flex flex-col items-center">
              <div className="flex items-center gap-3 mb-6">
                <div className="w-11 h-11 rounded-xl bg-[#03C75A] text-white flex items-center justify-center font-black text-xl">
                  쿡
                </div>
                <span className="text-2xl font-bold text-stone-800 tracking-tight">쿡포털</span>
              </div>

              <div className="w-full max-w-xl relative">
                <div className="flex items-center border-2 border-[#03C75A] rounded-full overflow-hidden bg-white shadow-sm">
                  <input
                    ref={inputRef}
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="재료, 조리순서, 꿀팁 검색 (예: 바지락, 화이트와인)"
                    className="flex-1 px-5 py-3 text-sm outline-none placeholder:text-stone-400"
                  />
                  {query && (
                    <button
                      type="button"
                      onClick={() => setQuery('')}
                      aria-label="검색어 지우기"
                      className="px-2 text-stone-300 hover:text-stone-500"
                    >
                      ✕
                    </button>
                  )}
                  <button
                    type="button"
                    aria-label="검색"
                    className="h-11 w-14 flex items-center justify-center bg-[#03C75A] text-white hover:bg-[#02b350]"
                    onClick={() => inputRef.current && inputRef.current.focus()}
                  >
                    🔍
                  </button>
                </div>

                {query && (
                  <div className="absolute z-20 top-full mt-2 w-full bg-white rounded-xl border border-stone-200 shadow-lg overflow-hidden animate-fade-in">
                    {results.length === 0 ? (
                      <p className="px-4 py-4 text-sm text-stone-400 text-center">"{query}"에 대한 검색 결과가 없어요.</p>
                    ) : (
                      <ul className="max-h-72 overflow-y-auto divide-y divide-stone-100">
                        {results.map((r, idx) => (
                          <li key={idx}>
                            <button
                              type="button"
                              onClick={() => onResultClick(r)}
                              className="w-full text-left px-4 py-2.5 hover:bg-green-50 flex items-start gap-2"
                            >
                              <Badge variant="green" className="mt-0.5 shrink-0">{r.tag}</Badge>
                              <span className="text-sm text-stone-700">{r.text}</span>
                            </button>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                )}
              </div>

              <div className="mt-8 w-full">
                <QuickMenu
                  items={[
                    { label: '재료', icon: '🧺', onClick: () => document.getElementById('ingredients-section')?.scrollIntoView({ behavior: 'smooth' }) },
                    { label: '조리순서', icon: '🍳', onClick: () => document.getElementById('steps-section')?.scrollIntoView({ behavior: 'smooth' }) },
                    { label: '타이머', icon: '⏱️', onClick: () => document.getElementById('timer-section')?.scrollIntoView({ behavior: 'smooth' }) },
                    { label: '꿀팁', icon: '💡', onClick: () => document.getElementById('tips-section')?.scrollIntoView({ behavior: 'smooth' }) },
                    { label: favorited ? '찜 완료' : '찜하기', icon: favorited ? '⭐' : '☆', onClick: onToggleFavorite },
                    { label: '공유', icon: '🔗', onClick: onShare },
                    { label: '인쇄', icon: '🖨️', onClick: onPrint },
                  ]}
                />
              </div>
            </div>
          </div>
        </section>
      );
    }

    function RecipeIntro() {
      return (
        <section className="max-w-5xl mx-auto px-4 sm:px-6 mt-8 grid grid-cols-1 lg:grid-cols-2 gap-6 items-center animate-fade-in">
          <div className="rounded-xl overflow-hidden border border-stone-200 aspect-[4/3]">
            <img src={HERO_IMAGE} alt="봉골레 파스타 완성 사진" className="w-full h-full object-cover" />
          </div>
          <div>
            <div className="flex flex-wrap gap-2 mb-3">
              <Badge variant="green">⏱️ 20분 완성</Badge>
              <Badge variant="info">👤 1인분</Badge>
              <Badge variant="default">난이도: 보통</Badge>
            </div>
            <h1 className="text-3xl font-extrabold text-stone-900">봉골레 파스타</h1>
            <p className="mt-1 text-stone-500 font-medium">집에서 완성</p>
            <p className="mt-4 text-stone-600 leading-relaxed">
              바지락 해감만 미리 해두면 20분 안에 레스토랑 못지않은 맛이 나와요.
            </p>
          </div>
        </section>
      );
    }

    function IngredientsCard({ checked, onToggle, onReset }) {
      const total = INGREDIENTS.length;
      const done = Object.values(checked).filter(Boolean).length;
      return (
        <Card id="ingredients-section" className="scroll-mt-20">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-lg font-bold text-stone-900">🧺 재료 <span className="text-sm font-normal text-stone-400">(1인분)</span></h2>
            <Button variant="ghost" size="sm" onClick={onReset}>초기화</Button>
          </div>
          <ul className="divide-y divide-stone-100">
            {INGREDIENTS.map((item, idx) => (
              <CheckItem key={idx} checked={!!checked[idx]} onToggle={() => onToggle(idx)}>
                {item}
              </CheckItem>
            ))}
          </ul>
          <p className="mt-4 text-xs text-stone-400 text-right">{done} / {total}개 준비 완료</p>
        </Card>
      );
    }

    function TimerWidget() {
      const DEFAULT_SECONDS = 20 * 60;
      const [secondsLeft, setSecondsLeft] = useState(DEFAULT_SECONDS);
      const [running, setRunning] = useState(false);

      useEffect(() => {
        if (!running) return;
        if (secondsLeft <= 0) {
          setRunning(false);
          return;
        }
        const id = setInterval(() => {
          setSecondsLeft((s) => Math.max(0, s - 1));
        }, 1000);
        return () => clearInterval(id);
      }, [running, secondsLeft]);

      const mm = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
      const ss = String(secondsLeft % 60).padStart(2, '0');
      const done = secondsLeft === 0;

      return (
        <Card id="timer-section" className="scroll-mt-20 text-center">
          <h2 className="text-lg font-bold text-stone-900 mb-3">⏱️ 20분 타이머</h2>
          <p className={`text-4xl font-mono font-bold mb-4 ${done ? 'text-[#03C75A]' : 'text-stone-800'}`}>
            {mm}:{ss}
          </p>
          {done && <p className="text-sm text-[#03C75A] font-semibold mb-3">완성! 맛있게 드세요 🍝</p>}
          <div className="flex justify-center gap-2">
            <Button variant="primary" size="sm" disabled={done} onClick={() => setRunning((r) => !r)}>
              {running ? '일시정지' : '시작'}
            </Button>
            <Button
              variant="secondary"
              size="sm"
              onClick={() => { setRunning(false); setSecondsLeft(DEFAULT_SECONDS); }}
            >
              초기화
            </Button>
          </div>
        </Card>
      );
    }

    function StepsCard() {
      return (
        <Card id="steps-section" className="scroll-mt-20">
          <h2 className="text-lg font-bold text-stone-900 mb-4">🍳 만드는 법</h2>
          <ol className="space-y-4">
            {STEPS.map((step, idx) => (
              <li key={idx} className="flex gap-3">
                <span className="shrink-0 flex items-center justify-center w-7 h-7 rounded-full bg-[#03C75A] text-white text-sm font-bold">
                  {idx + 1}
                </span>
                <div>
                  <p className="font-semibold text-stone-800 text-sm">{step.title}</p>
                  <p className="text-sm text-stone-600 mt-0.5 leading-relaxed">{step.desc}</p>
                </div>
              </li>
            ))}
          </ol>
        </Card>
      );
    }

    function TipsCard() {
      return (
        <Card id="tips-section" className="scroll-mt-20">
          <h2 className="text-lg font-bold text-stone-900 mb-4">💡 꿀팁</h2>
          <ul className="space-y-2">
            {TIPS.map((tip, idx) => (
              <li key={idx} className="flex items-start gap-2 text-sm text-stone-600">
                <span className="text-[#03C75A] mt-0.5">•</span>
                <span>{tip}</span>
              </li>
            ))}
          </ul>
        </Card>
      );
    }

    function Toast({ message }) {
      if (!message) return null;
      return (
        <div className="fixed left-1/2 bottom-6 -translate-x-1/2 bg-stone-800 text-white text-sm px-4 py-2 rounded-full shadow-lg animate-toast z-50">
          {message}
        </div>
      );
    }

    function RecipePage() {
      const [query, setQuery] = useState('');
      const [checked, setChecked] = useState({});
      const [favorited, setFavorited] = useState(false);
      const [toast, setToast] = useState('');

      const results = useMemo(() => {
        if (!query.trim()) return [];
        const q = query.trim().toLowerCase();
        return SEARCH_INDEX.filter((item) => item.text.toLowerCase().includes(q)).slice(0, 8);
      }, [query]);

      const showToast = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 1800);
      }, []);

      const handleResultClick = useCallback((result) => {
        setQuery('');
        document.getElementById(result.target)?.scrollIntoView({ behavior: 'smooth' });
      }, []);

      const handleToggleFavorite = useCallback(() => {
        setFavorited((f) => {
          showToast(!f ? '레시피를 찜했어요 ⭐' : '찜을 취소했어요');
          return !f;
        });
      }, [showToast]);

      const handleShare = useCallback(() => {
        const url = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(
            () => showToast('링크가 복사되었습니다'),
            () => showToast('복사에 실패했어요')
          );
        } else {
          showToast('복사가 지원되지 않는 환경이에요');
        }
      }, [showToast]);

      const handlePrint = useCallback(() => window.print(), []);

      const toggleIngredient = useCallback((idx) => {
        setChecked((prev) => ({ ...prev, [idx]: !prev[idx] }));
      }, []);

      const resetIngredients = useCallback(() => setChecked({}), []);

      return (
        <main>
          <SearchHero
            query={query}
            setQuery={setQuery}
            results={results}
            onResultClick={handleResultClick}
            favorited={favorited}
            onToggleFavorite={handleToggleFavorite}
            onPrint={handlePrint}
            onShare={handleShare}
          />
          <RecipeIntro />
          <div className="max-w-5xl mx-auto px-4 sm:px-6 mt-8 grid grid-cols-1 lg:grid-cols-5 gap-6 items-start">
            <div className="lg:col-span-2 space-y-6 lg:sticky lg:top-4">
              <IngredientsCard checked={checked} onToggle={toggleIngredient} onReset={resetIngredients} />
              <TimerWidget />
            </div>
            <div className="lg:col-span-3 space-y-6">
              <StepsCard />
              <TipsCard />
            </div>
          </div>
          <Toast message={toast} />
        </main>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return (
        <div className="min-h-screen flex flex-col">
          <UtilityBar onPrint={() => window.print()} />
          <RecipePage />
          <Footer />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
