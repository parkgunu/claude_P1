<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="crayon" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.7" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="flash" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff7cc"/>
      <stop offset="100%" stop-color="#2a2a3a"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="#fdf6e3"/>
  <line x1="400" y1="10" x2="400" y2="590" stroke="#a89060" stroke-width="6" filter="url(#crayon)"/>
  <line x1="10" y1="300" x2="790" y2="300" stroke="#a89060" stroke-width="6" filter="url(#crayon)"/>

  <!-- Panel 1: 카레의 비밀 -->
  <g filter="url(#crayon)">
    <rect x="20" y="20" width="360" height="260" fill="#fff0e0" opacity="0.7"/>
    <ellipse cx="200" cy="200" rx="120" ry="24" fill="#e08a1e" stroke="#a85f0e" stroke-width="3"/>
    <circle cx="160" cy="110" r="36" fill="#ffd8a8" stroke="#d68a3c" stroke-width="4"/>
    <path d="M148,150 Q160,130 172,150" stroke="#4a3320" stroke-width="3" fill="none"/>
    <circle cx="260" cy="110" r="36" fill="#ffe0c0" stroke="#c07030" stroke-width="4"/>
    <path d="M245,100 L255,105 M275,100 L265,105" stroke="#4a3320" stroke-width="3"/>
    <path d="M248,122 Q260,115 272,122" stroke="#c02020" stroke-width="3" fill="none"/>
    <path d="M300,90 L320,70 M300,70 L320,90" stroke="#d02020" stroke-width="4" stroke-linecap="round"/>
    <text x="200" y="255" font-family="'Comic Sans MS', sans-serif" font-size="18" fill="#a85f0e" text-anchor="middle" font-weight="bold">"이 카레... 그 사람 맛이랑 똑같아요"</text>
  </g>

  <!-- Panel 2: 머리 자르기 반전 -->
  <g filter="url(#crayon)">
    <rect x="420" y="20" width="360" height="260" fill="#eaf0ff" opacity="0.7"/>
    <rect x="565" y="165" width="70" height="60" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="3"/>
    <circle cx="600" cy="130" r="38" fill="#ffd8a8" stroke="#d68a3c" stroke-width="4"/>
    <path d="M562,118 Q600,80 638,118 Q640,98 600,93 Q560,98 562,118" fill="#2a1a10"/>
    <circle cx="588" cy="128" r="4" fill="#4a3320"/>
    <circle cx="612" cy="128" r="4" fill="#4a3320"/>
    <path d="M580,150 L620,150" stroke="#4a3320" stroke-width="3" stroke-linecap="round"/>
    <path d="M540,200 q6,10 -4,20" stroke="#2a1a10" stroke-width="3" fill="none"/>
    <path d="M528,215 q6,10 -4,20" stroke="#2a1a10" stroke-width="3" fill="none"/>
    <ellipse cx="700" cy="110" rx="70" ry="40" fill="#ffffff" stroke="#4a4f66" stroke-width="3"/>
    <path d="M660,140 L640,155 L668,148 Z" fill="#ffffff" stroke="#4a4f66" stroke-width="3"/>
    <text x="700" y="105" font-family="'Comic Sans MS', sans-serif" font-size="13" fill="#4a4f66" text-anchor="middle" font-weight="bold">회장님 막내아들...?!</text>
    <text x="600" y="255" font-family="'Comic Sans MS', sans-serif" font-size="18" fill="#4d7ea8" text-anchor="middle" font-weight="bold">과거와의 결별</text>
  </g>

  <!-- Panel 3: 눈물의 운동 -->
  <g filter="url(#crayon)">
    <rect x="20" y="320" width="360" height="260" fill="#eafff0" opacity="0.7"/>
    <circle cx="200" cy="410" r="36" fill="#ffd8a8" stroke="#d68a3c" stroke-width="4"/>
    <path d="M182,428 Q200,422 218,428" stroke="#4a3320" stroke-width="3" fill="none"/>
    <path d="M186,400 L182,415" stroke="#8fd0ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M214,400 L218,415" stroke="#8fd0ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M200,446 L200,500" stroke="#3a5a9a" stroke-width="14" stroke-linecap="round"/>
    <path d="M200,460 L155,435 M200,460 L245,435" stroke="#3a5a9a" stroke-width="12" stroke-linecap="round"/>
    <path d="M200,500 L175,548 M200,500 L225,548" stroke="#2a3a6a" stroke-width="14" stroke-linecap="round"/>
    <path d="M110,370 L140,370 M110,380 L150,380" stroke="#d02020" stroke-width="3" stroke-linecap="round"/>
    <text x="200" y="555" font-family="'Comic Sans MS', sans-serif" font-size="18" fill="#3f9a52" text-anchor="middle" font-weight="bold">"강해져야 해..."</text>
  </g>

  <!-- Panel 4: 폭우 속 재회 -->
  <g filter="url(#crayon)">
    <rect x="420" y="320" width="360" height="260" fill="url(#flash)" opacity="0.85"/>
    <polygon points="600,330 615,370 600,365 610,400" fill="#fff7cc" stroke="#e0c840" stroke-width="2"/>
    <line x1="470" y1="400" x2="450" y2="440" stroke="#9fc4ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="530" y1="400" x2="510" y2="440" stroke="#9fc4ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="670" y1="400" x2="650" y2="440" stroke="#9fc4ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="730" y1="400" x2="710" y2="440" stroke="#9fc4ff" stroke-width="4" stroke-linecap="round"/>
    <!-- 인물 A -->
    <circle cx="540" cy="470" r="30" fill="#ffd8a8" stroke="#d68a3c" stroke-width="4"/>
    <path d="M518,458 Q540,430 562,458" fill="#2a1a10"/>
    <circle cx="532" cy="468" r="3.5" fill="#4a3320"/>
    <circle cx="550" cy="468" r="3.5" fill="#4a3320"/>
    <ellipse cx="541" cy="480" rx="6" ry="4" fill="#4a3320"/>
    <path d="M540,498 L540,550" stroke="#d64545" stroke-width="12" stroke-linecap="round"/>
    <!-- 인물 B -->
    <circle cx="650" cy="470" r="30" fill="#ffe0c0" stroke="#c07030" stroke-width="4"/>
    <path d="M628,455 Q650,428 672,455 Q674,440 650,436 Q626,440 628,455" fill="#3a2a1a"/>
    <circle cx="642" cy="468" r="3.5" fill="#4a3320"/>
    <circle cx="660" cy="468" r="3.5" fill="#4a3320"/>
    <ellipse cx="651" cy="480" rx="6" ry="4" fill="#4a3320"/>
    <path d="M650,498 L650,550" stroke="#3a5a9a" stroke-width="12" stroke-linecap="round"/>
    <text x="600" y="560" font-family="'Comic Sans MS', sans-serif" font-size="18" fill="#fffef2" text-anchor="middle" font-weight="bold">"당신이... 왜 여기에"</text>
  </g>
</svg>
