<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="crayon" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="crayonThick" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.7" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- paper background -->
  <rect x="0" y="0" width="800" height="600" fill="#fffaf0"/>

  <!-- grid divider lines (crayon) -->
  <line x1="400" y1="10" x2="400" y2="590" stroke="#c9b896" stroke-width="6" filter="url(#crayon)"/>
  <line x1="10" y1="300" x2="790" y2="300" stroke="#c9b896" stroke-width="6" filter="url(#crayon)"/>

  <!-- ===================== Panel 1: 카레 아침밥 (top-left) ===================== -->
  <g filter="url(#crayonThick)">
    <rect x="20" y="20" width="360" height="260" fill="#fff4e0" opacity="0.6"/>
    <!-- table -->
    <rect x="40" y="200" width="320" height="20" fill="#c68642"/>
    <!-- plate -->
    <ellipse cx="200" cy="190" rx="120" ry="30" fill="#ffffff" stroke="#b0a99f" stroke-width="4"/>
    <!-- rice -->
    <ellipse cx="150" cy="182" rx="45" ry="20" fill="#fffef2" stroke="#e8dfc0" stroke-width="3"/>
    <!-- curry -->
    <ellipse cx="245" cy="182" rx="55" ry="22" fill="#e08a1e" stroke="#a85f0e" stroke-width="3"/>
    <ellipse cx="230" cy="178" rx="12" ry="8" fill="#c96b12"/>
    <ellipse cx="260" cy="186" rx="10" ry="7" fill="#c96b12"/>
    <!-- steam -->
    <path d="M220,130 Q225,110 218,95 Q212,80 222,65" stroke="#f0c98a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M250,135 Q256,115 248,100 Q242,85 252,70" stroke="#f0c98a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- face eating -->
    <circle cx="200" cy="90" r="42" fill="#ffd8a8" stroke="#d68a3c" stroke-width="4"/>
    <circle cx="185" cy="82" r="4" fill="#4a3320"/>
    <circle cx="215" cy="82" r="4" fill="#4a3320"/>
    <path d="M180,105 Q200,120 220,105" stroke="#4a3320" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M150,60 Q200,30 250,60" stroke="#5a3a1a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <text x="200" y="255" font-family="'Comic Sans MS', sans-serif" font-size="22" fill="#a85f0e" text-anchor="middle" font-weight="bold">카레 아침밥</text>
  </g>

  <!-- ===================== Panel 2: 머리 자르기 (top-right) ===================== -->
  <g filter="url(#crayonThick)">
    <rect x="420" y="20" width="360" height="260" fill="#eaf6ff" opacity="0.6"/>
    <!-- chair -->
    <rect x="560" y="180" width="80" height="70" fill="#8fb8de" stroke="#4d7ea8" stroke-width="4"/>
    <!-- person sitting -->
    <circle cx="600" cy="130" r="40" fill="#ffd8a8" stroke="#d68a3c" stroke-width="4"/>
    <path d="M562,120 Q600,80 638,120 Q640,100 600,95 Q560,100 562,120" fill="#3a2a1a"/>
    <circle cx="588" cy="128" r="4" fill="#4a3320"/>
    <circle cx="612" cy="128" r="4" fill="#4a3320"/>
    <path d="M588,150 Q600,158 612,150" stroke="#4a3320" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="565" y="165" width="70" height="60" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="3"/>
    <!-- scissors hand -->
    <path d="M650,140 L690,110" stroke="#ffd8a8" stroke-width="10" stroke-linecap="round"/>
    <path d="M685,105 L705,90 M685,110 L705,120" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
    <!-- falling hair bits -->
    <path d="M540,200 q5,10 -3,18" stroke="#3a2a1a" stroke-width="3" fill="none"/>
    <path d="M530,215 q5,10 -3,18" stroke="#3a2a1a" stroke-width="3" fill="none"/>
    <path d="M660,220 q5,10 -3,18" stroke="#3a2a1a" stroke-width="3" fill="none"/>
    <text x="600" y="255" font-family="'Comic Sans MS', sans-serif" font-size="22" fill="#4d7ea8" text-anchor="middle" font-weight="bold">머리 자르기</text>
  </g>

  <!-- ===================== Panel 3: 운동 (bottom-left) ===================== -->
  <g filter="url(#crayonThick)">
    <rect x="20" y="320" width="360" height="260" fill="#eafff0" opacity="0.6"/>
    <!-- mat -->
    <rect x="120" y="500" width="160" height="20" rx="6" fill="#7fd48a" stroke="#3f9a52" stroke-width="3"/>
    <!-- person doing squat/stretch -->
    <circle cx="200" cy="410" r="38" fill="#ffd8a8" stroke="#d68a3c" stroke-width="4"/>
    <circle cx="188" cy="405" r="4" fill="#4a3320"/>
    <circle cx="212" cy="405" r="4" fill="#4a3320"/>
    <path d="M188,425 Q200,432 212,425" stroke="#4a3320" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M200,448 L200,500" stroke="#3a5a9a" stroke-width="14" stroke-linecap="round"/>
    <path d="M200,460 L150,430 M200,460 L250,430" stroke="#3a5a9a" stroke-width="12" stroke-linecap="round"/>
    <path d="M200,500 L175,545 M200,500 L225,545" stroke="#2a3a6a" stroke-width="14" stroke-linecap="round"/>
    <!-- sweat drops -->
    <path d="M150,395 q-6,10 0,16 q6,-6 0,-16" fill="#8fd0ff"/>
    <path d="M250,400 q-6,10 0,16 q6,-6 0,-16" fill="#8fd0ff"/>
    <!-- clock 1시간 -->
    <circle cx="320" cy="360" r="30" fill="#fffef2" stroke="#e0a030" stroke-width="4"/>
    <line x1="320" y1="360" x2="320" y2="340" stroke="#4a3320" stroke-width="3" stroke-linecap="round"/>
    <line x1="320" y1="360" x2="335" y2="365" stroke="#4a3320" stroke-width="3" stroke-linecap="round"/>
    <text x="200" y="560" font-family="'Comic Sans MS', sans-serif" font-size="22" fill="#3f9a52" text-anchor="middle" font-weight="bold">1시간 운동</text>
  </g>

  <!-- ===================== Panel 4: 폭우 속 등교 (bottom-right) ===================== -->
  <g filter="url(#crayonThick)">
    <rect x="420" y="320" width="360" height="260" fill="#e8eaf6" opacity="0.6"/>
    <!-- dark cloud -->
    <ellipse cx="520" cy="360" rx="70" ry="34" fill="#7a7f96" stroke="#4a4f66" stroke-width="4"/>
    <ellipse cx="600" cy="345" rx="55" ry="28" fill="#7a7f96" stroke="#4a4f66" stroke-width="4"/>
    <ellipse cx="670" cy="365" rx="50" ry="26" fill="#7a7f96" stroke="#4a4f66" stroke-width="4"/>
    <!-- rain -->
    <line x1="470" y1="400" x2="450" y2="440" stroke="#5a8fd6" stroke-width="4" stroke-linecap="round"/>
    <line x1="510" y1="400" x2="490" y2="440" stroke="#5a8fd6" stroke-width="4" stroke-linecap="round"/>
    <line x1="550" y1="400" x2="530" y2="440" stroke="#5a8fd6" stroke-width="4" stroke-linecap="round"/>
    <line x1="590" y1="400" x2="570" y2="440" stroke="#5a8fd6" stroke-width="4" stroke-linecap="round"/>
    <line x1="630" y1="400" x2="610" y2="440" stroke="#5a8fd6" stroke-width="4" stroke-linecap="round"/>
    <line x1="670" y1="400" x2="650" y2="440" stroke="#5a8fd6" stroke-width="4" stroke-linecap="round"/>
    <line x1="710" y1="400" x2="690" y2="440" stroke="#5a8fd6" stroke-width="4" stroke-linecap="round"/>
    <line x1="490" y1="430" x2="470" y2="470" stroke="#5a8fd6" stroke-width="4" stroke-linecap="round"/>
    <line x1="610" y1="430" x2="590" y2="470" stroke="#5a8fd6" stroke-width="4" stroke-linecap="round"/>
    <!-- running person, no umbrella -->
    <circle cx="600" cy="470" r="30" fill="#ffd8a8" stroke="#d68a3c" stroke-width="4"/>
    <path d="M578,460 Q600,435 622,460" fill="#3a2a1a"/>
    <circle cx="592" cy="468" r="3.5" fill="#4a3320"/>
    <circle cx="610" cy="468" r="3.5" fill="#4a3320"/>
    <path d="M592,482 Q601,477 610,482" stroke="#4a3320" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M600,498 L600,530" stroke="#d64545" stroke-width="12" stroke-linecap="round"/>
    <path d="M600,505 L565,490 M600,505 L640,485" stroke="#d64545" stroke-width="10" stroke-linecap="round"/>
    <path d="M600,530 L575,565 M600,530 L630,560" stroke="#5a3a9a" stroke-width="12" stroke-linecap="round"/>
    <!-- motion lines -->
    <path d="M545,510 L520,505 M545,525 L515,522" stroke="#4a4f66" stroke-width="3" stroke-linecap="round"/>
    <text x="600" y="255" font-family="'Comic Sans MS', sans-serif" font-size="1" fill="none"/>
    <text x="600" y="595" font-family="'Comic Sans MS', sans-serif" font-size="22" fill="#4a4f66" text-anchor="middle" font-weight="bold">폭우 속 등교</text>
  </g>
</svg>
